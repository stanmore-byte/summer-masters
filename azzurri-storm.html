<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ Azzurri U-11 Premier — 2026 Summer Program</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,Arial,sans-serif;background:#000;color:#fff;min-height:100vh}

/* ── SCREENS ── */
.screen{display:none}
.screen.active{display:block}
#app-screen.active{display:flex;flex-direction:column;min-height:100vh}

/* ── PLAYER SELECTOR ── */
#select-screen{min-height:100vh;padding:20px 16px 40px}
.sel-hero{text-align:center;padding:24px 0 20px}
.sel-hero h1{font-size:2.2em;font-weight:900;background:linear-gradient(90deg,#D946EF,#A21CAF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sel-hero p{color:#7fbfff;margin-top:6px;font-size:1em}
.sel-prompt{text-align:center;font-size:.82em;color:rgba(255,255,255,.38);padding:0 20px 18px;margin-top:-4px;font-weight:500;letter-spacing:.01em}
.player-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;max-width:720px;margin:0 auto}
.pc{border-radius:14px;padding:14px 10px;text-align:center;cursor:pointer;border:2px solid transparent;transition:all .2s;background:rgba(255,255,255,.06)}
.pc:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.35)}
.pc-av{width:52px;height:52px;border-radius:50%;margin:0 auto 9px;display:flex;align-items:center;justify-content:center;font-size:1.35em;font-weight:900;color:#fff;border:3px solid rgba(255,255,255,.25)}
.pc-name{font-weight:800;font-size:.93em}
.pc-bar-wrap{height:4px;background:rgba(255,255,255,.1);border-radius:2px;margin-top:7px;overflow:hidden}
.pc-bar{height:100%;border-radius:2px;transition:width .5s}
.pc-done{font-size:.7em;color:rgba(255,255,255,.4);margin-top:4px}

/* ── APP HEADER ── */
.app-hdr{position:sticky;top:0;z-index:100;padding:11px 16px;background:rgba(13,27,42,.97);display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08)}
.ah-av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.9em;color:#fff;flex-shrink:0}
.ah-info{flex:1;min-width:0}
.ah-name{font-weight:800;font-size:1em}
.ah-sub{font-size:.75em;color:rgba(255,255,255,.5)}
.btn-ghost{background:none;border:1px solid rgba(255,255,255,.22);color:rgba(255,255,255,.7);padding:5px 11px;border-radius:20px;font-size:.75em;cursor:pointer;white-space:nowrap;font-weight:600}
.btn-ghost:hover{border-color:rgba(255,255,255,.55);color:#fff}

/* ── TABS ── */
.tab-bar{position:sticky;top:60px;z-index:99;display:flex;background:rgba(13,27,42,.95);border-bottom:1px solid rgba(255,255,255,.08)}
.tab-btn{flex:1;max-width:130px;font-size:.68em;padding:12px;text-align:center;font-size:.8em;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.4);cursor:pointer;border-bottom:3px solid transparent;transition:all .2s}
.tab-btn.active{color:#FFD700;border-bottom-color:#FFD700}
.tab-pane{display:none;padding:14px 14px 40px}
.tab-pane.active{display:block}

/* ── OVERALL BAR ── */
.overall-bar{background:rgba(255,255,255,.07);border-radius:12px;padding:13px 16px;margin-bottom:14px}
.ob-row{display:flex;justify-content:space-between;margin-bottom:7px;font-size:.8em}
.ob-row span:first-child{color:#7fbfff;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.ob-row span:last-child{color:rgba(255,255,255,.5)}
.ob-track{height:11px;background:rgba(255,255,255,.1);border-radius:6px;overflow:hidden}
.ob-fill{height:100%;background:linear-gradient(90deg,#FFD700,#FF8C00);border-radius:6px;transition:width .5s}

/* ── WEEK ── */
.week-sec{margin-bottom:10px;border-radius:14px;overflow:hidden}
.wk-hdr{padding:13px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.week1 .wk-hdr{background:linear-gradient(135deg,rgba(30,87,153,.85),rgba(41,128,185,.65))}
.week2 .wk-hdr{background:linear-gradient(135deg,rgba(106,13,173,.85),rgba(142,68,173,.65))}
.week3 .wk-hdr{background:linear-gradient(135deg,rgba(176,55,10,.85),rgba(192,57,43,.65))}
.wk-num{font-size:1.45em;font-weight:900;opacity:.35;min-width:28px}
.wk-inf{flex:1}
.wk-inf h3{font-size:.97em;font-weight:800}
.wk-inf p{font-size:.72em;opacity:.6;margin-top:1px}
.wk-pct{font-size:1.15em;font-weight:900;color:#FFD700}
.wk-chev{opacity:.5;font-size:.8em;transition:transform .2s}
.week-sec.open .wk-chev{transform:rotate(180deg)}
.wk-body{display:none;background:rgba(255,255,255,.025)}
.week-sec.open .wk-body{display:block}

/* ── DAY ── */
.day-lbl{padding:9px 16px 4px;display:flex;justify-content:space-between}
.dl-day{font-size:.72em;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:#7fbfff}
.dl-theme{font-size:.7em;color:rgba(255,255,255,.3);font-weight:600}
.day-sep{border-bottom:1px solid rgba(255,255,255,.05)}

/* ── DRILL ROW ── */
.dr{display:flex;align-items:center;gap:9px;padding:9px 16px;cursor:pointer;transition:background .15s}
.dr:hover{background:rgba(255,255,255,.05)}
.dr.done{background:rgba(39,174,96,.08)}
.dr-cb{width:23px;height:23px;border:2px solid rgba(255,255,255,.22);border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s}
.dr.done .dr-cb{background:#27ae60;border-color:#27ae60}
.dr-cb-inner{display:none;width:5px;height:9px;border:2.5px solid white;border-top:none;border-left:none;transform:rotate(45deg) translateY(-2px)}
.dr.done .dr-cb-inner{display:block}
.dr-mid{flex:1;min-width:0}
.dr-title{font-weight:700;font-size:.9em;display:flex;align-items:center;gap:6px}
.dr.done .dr-title{opacity:.45;text-decoration:line-through}
.dr-badge{font-size:.68em;background:rgba(255,255,255,.11);border-radius:4px;padding:1px 5px;color:rgba(255,255,255,.55);font-weight:700;text-decoration:none}
.dr-sub{font-size:.77em;color:rgba(255,255,255,.4);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}

/* ── SHOW MOVE BUTTON ── */
.show-move-btn{flex-shrink:0;width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:1em;transition:all .2s;cursor:pointer;position:relative}
.show-move-btn:hover{background:rgba(255,215,0,.15);border-color:rgba(255,215,0,.45)}
.show-move-btn .tooltip{display:none;position:absolute;right:0;top:-30px;background:rgba(0,0,0,.85);color:#fff;font-size:.7em;padding:3px 7px;border-radius:6px;white-space:nowrap;pointer-events:none}
.show-move-btn:hover .tooltip{display:block}
.dr-video-btn{flex-shrink:0;width:34px;height:34px;border-radius:10px;background:rgba(220,50,50,.25);border:1px solid rgba(220,50,50,.55);display:flex;align-items:center;justify-content:center;font-size:.9em;cursor:pointer;margin-left:6px;text-decoration:none;color:#ff6b6b;position:relative;transition:all .2s}
.dr-video-btn:hover{background:rgba(220,50,50,.45);border-color:rgba(220,50,50,.9)}
.dr-video-btn .tooltip{display:none;position:absolute;right:0;top:-30px;background:rgba(0,0,0,.85);color:#fff;font-size:.7em;padding:3px 7px;border-radius:6px;white-space:nowrap;pointer-events:none}
.dr-video-btn:hover .tooltip{display:block}
.modal-video-wrap{position:relative;width:100%;padding-bottom:56.25%;margin-bottom:14px;border-radius:10px;overflow:hidden;background:#000}
.modal-video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}

/* ── RECOVERY / REST ── */
.rec-row{margin:4px 16px 6px;padding:10px 14px;background:rgba(39,174,96,.08);border-left:3px solid #2ecc71;border-radius:8px}
.rec-row strong{color:#2ecc71;font-size:.82em}
.rec-row p{font-size:.78em;color:rgba(255,255,255,.45);margin-top:3px;line-height:1.5}
.rest-row{padding:9px 16px;text-align:center;color:rgba(255,255,255,.28);font-size:.83em;font-style:italic}

/* ── TEAM TAB ── */
.team-section-title{font-size:.75em;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:#7fbfff;margin-bottom:10px}
.share-box{background:rgba(255,255,255,.05);border-radius:12px;padding:13px 14px;margin-bottom:16px}
.share-box h3{font-size:.8em;font-weight:700;color:#7fbfff;margin-bottom:8px}
.share-flex{display:flex;gap:7px;margin-bottom:7px;align-items:center}
.code-display{flex:1;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:7px 10px;font-family:monospace;font-size:.78em;color:#FFD700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-sm{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;padding:7px 12px;border-radius:8px;font-size:.76em;cursor:pointer;font-weight:700;white-space:nowrap}
.btn-sm:hover{background:rgba(255,255,255,.18)}
.btn-sm.gold{background:rgba(255,215,0,.14);border-color:rgba(255,215,0,.4);color:#FFD700}
.btn-sm.gold:hover{background:rgba(255,215,0,.24)}
.import-area{width:100%;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:7px 10px;font-family:monospace;font-size:.78em;color:#fff;resize:none;height:52px}
.import-area::placeholder{color:rgba(255,255,255,.28)}
.lb-list{display:flex;flex-direction:column;gap:7px}
.lb-row{background:rgba(255,255,255,.05);border-radius:12px;padding:11px 13px;display:flex;align-items:center;gap:11px;transition:background .2s}
.lb-row.me{border:1px solid rgba(255,215,0,.3);background:rgba(255,215,0,.06)}
.lb-rank{font-size:1.05em;font-weight:900;color:rgba(255,255,255,.25);min-width:22px;text-align:center}
.lb-rank.g{color:#FFD700}.lb-rank.s{color:#C0C0C0}.lb-rank.b{color:#CD7F32}
.lb-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.88em;color:#fff;flex-shrink:0}
.lb-inf{flex:1;min-width:0}
.lb-name{font-weight:700;font-size:.9em}
.lb-name .you-tag{color:#FFD700;font-size:.8em;font-weight:600}
.lb-bar-wrap{height:5px;background:rgba(255,255,255,.08);border-radius:3px;margin-top:4px;overflow:hidden}
.lb-bar{height:100%;border-radius:3px;transition:width .6s}
.lb-num{font-size:.85em;font-weight:800;min-width:40px;text-align:right}

/* ── DRILL MODAL ── */
#drill-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:100;align-items:center;justify-content:center;padding:14px}
#drill-modal.open{display:flex}
.modal-box{background:#162233;border-radius:20px;width:100%;max-width:420px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.65);max-height:92vh;display:flex;flex-direction:column}
.modal-hdr{padding:13px 16px;display:flex;align-items:center;gap:9px;background:rgba(0,0,0,.25);flex-shrink:0}
.modal-num{font-size:.7em;font-weight:700;color:rgba(255,255,255,.5);background:rgba(255,255,255,.1);padding:3px 8px;border-radius:6px}
.modal-title{font-weight:800;flex:1;font-size:1.03em}
.modal-x{width:28px;height:28px;background:rgba(255,255,255,.1);border:none;border-radius:8px;color:#fff;font-size:.95em;cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal-visual{background:#1a4d1a;flex-shrink:0}
.modal-visual svg{width:100%;display:block}
.modal-scroll{overflow-y:auto;flex:1}
.modal-body{padding:14px 16px}
.modal-desc{font-size:.88em;color:rgba(255,255,255,.85);line-height:1.65;margin-bottom:11px}
.modal-sets{display:inline-block;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.3);border-radius:8px;padding:4px 12px;font-size:.8em;color:#FFD700;font-weight:700;margin-bottom:13px}
.modal-acts{display:flex;gap:8px}
.btn-mark{flex:1;padding:11px;border-radius:12px;border:none;font-weight:800;font-size:.93em;cursor:pointer;transition:all .2s;background:#27ae60;color:#fff}
.btn-mark.undone{background:rgba(255,80,80,.2);color:#ff6b6b}
.btn-dismiss{padding:11px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:none;color:rgba(255,255,255,.65);font-weight:700;font-size:.88em;cursor:pointer}

/* ── TOAST ── */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#27ae60;color:#fff;padding:9px 20px;border-radius:20px;font-weight:700;font-size:.88em;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}

/* ── SVG PATH ANIMATION ── */
@keyframes drawLine{from{stroke-dashoffset:var(--len,600)}to{stroke-dashoffset:0}}
.ap{stroke-dasharray:var(--len,600);stroke-dashoffset:var(--len,600);animation:drawLine 1.1s ease-out forwards}
.ap1{animation-delay:.5s}
.ap2{animation-delay:1s}
.ap3{animation-delay:1.4s}

@media(max-width:400px){
  .player-grid{grid-template-columns:repeat(3,1fr)}
  .dr-sub{max-width:175px}
}

/* ── EXTRA MILE QUOTE ── */
.extra-mile{text-align:center;padding:18px 20px 22px;margin-bottom:4px}
.em-quote{font-size:.95rem;font-style:italic;color:rgba(255,255,255,.65);line-height:1.6;margin-bottom:6px}
.em-champ{font-size:.78rem;font-weight:700;letter-spacing:.06em;color:rgba(255,215,0,.75);margin-bottom:4px}
.em-attr{font-size:.67rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.25)}
.em-attr em{font-style:italic;text-transform:none;letter-spacing:0}

/* ── DAILY MODULES ── */
.daily-section{margin-bottom:14px}
.daily-hdr{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;cursor:pointer;user-select:none;transition:background .15s}
.daily-hdr:hover{background:rgba(255,255,255,.09)}
.daily-hdr-left{display:flex;align-items:center;gap:8px}
.daily-hdr-icon{font-size:1.1em}
.daily-hdr-title{font-weight:800;font-size:.88em}
.daily-hdr-prog{font-size:.7em;color:rgba(255,255,255,.35);margin-left:4px}
.daily-hdr-arrow{font-size:.75em;color:rgba(255,255,255,.3);transition:transform .2s}
.daily-hdr.open .daily-hdr-arrow{transform:rotate(180deg)}
/* ── SECTION HEADER PROGRESS BAR ── */
.daily-hdr-mid{display:flex;align-items:center;gap:6px;flex:1;margin:0 10px}
.daily-hdr-pbar{flex:1;height:5px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.daily-hdr-pfill{height:100%;border-radius:3px;transition:width .4s ease,background .4s ease}
.daily-hdr-pct{font-size:.68em;font-weight:700;color:rgba(255,255,255,.35);min-width:28px;text-align:right}
/* ── DAY STRIP ── */
.day-strip{display:flex;gap:5px;padding:2px 0 12px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.day-strip::-webkit-scrollbar{display:none}
.day-pill{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 8px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);cursor:pointer;min-width:42px;flex-shrink:0;transition:all .15s}
.day-pill:hover{background:rgba(255,255,255,.09)}
.day-pill.sel{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35)}
.day-pill-lbl{font-size:.62em;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:rgba(255,255,255,.35)}
.day-pill.sel .day-pill-lbl{color:rgba(255,255,255,.7)}
.day-pill-num{font-size:.92em;font-weight:800;color:rgba(255,255,255,.55)}
.day-pill.sel .day-pill-num{color:#fff}
.day-pill.is-today .day-pill-num{color:#FFD700}
.day-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.1)}
.day-dot.partial{background:#FFD700}
.day-dot.done{background:#27ae60}
.day-viewing{font-size:.76em;color:rgba(255,255,255,.35);text-align:center;padding:2px 0 10px;line-height:1.4}
.day-viewing strong{color:rgba(255,255,255,.6)}
.day-status{font-weight:700;color:rgba(255,255,255,.45)}
.done-status{color:#27ae60!important}
.partial-status{color:#FFD700!important}
.future-item{opacity:.28;cursor:default;pointer-events:none}
.past-item{opacity:1;cursor:default;pointer-events:none}
.daily-body{display:none;padding:8px 4px 2px}
.daily-body.open{display:block}
.daily-item{display:flex;align-items:center;gap:12px;padding:8px 4px;border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer}
.daily-item:last-child{border-bottom:none}
.daily-item.done .daily-item-name{opacity:.45;text-decoration:line-through}
.daily-cb{width:22px;height:22px;border:2px solid rgba(255,255,255,.22);border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s}
.daily-item.done .daily-cb{background:#27ae60;border-color:#27ae60}
.daily-cb-inner{display:none;width:5px;height:9px;border:2.5px solid white;border-top:none;border-left:none;transform:rotate(45deg) translateY(-2px)}
.daily-item.done .daily-cb-inner{display:block}
.daily-item-name{font-size:.86em;font-weight:600}
.daily-item-name-wrap{display:flex;align-items:baseline;gap:8px;flex:1;min-width:0}
.daily-item-target{font-size:.75em;font-weight:700;color:rgba(255,255,255,.38);white-space:nowrap;background:rgba(255,255,255,.07);padding:2px 7px;border-radius:5px;flex-shrink:0}
.daily-modules-wrap{margin-bottom:6px}
/* juggling */
.jug-section{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:13px 14px;margin-bottom:14px}
.jug-hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.jug-hdr-title{font-weight:800;font-size:.88em;flex:1}
.jug-pr-badge{font-size:.7em;background:rgba(255,215,0,.15);color:#FFD700;padding:2px 8px;border-radius:6px;font-weight:700}
.jug-input-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.jug-input{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:8px;color:#fff;font-size:1.05em;font-weight:700;padding:7px 10px;text-align:center;-moz-appearance:textfield;outline:none}
.jug-input::-webkit-inner-spin-button,.jug-input::-webkit-outer-spin-button{-webkit-appearance:none}
.jug-btn{background:rgba(255,215,0,.18);border:1px solid rgba(255,215,0,.4);color:#FFD700;font-weight:800;font-size:.8em;padding:7px 13px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:background .15s}
.jug-btn:hover{background:rgba(255,215,0,.32)}
.jug-log{max-height:88px;overflow-y:auto;margin-bottom:6px}
.jug-log-row{display:flex;justify-content:space-between;font-size:.74em;padding:3px 0;color:rgba(255,255,255,.38);border-bottom:1px solid rgba(255,255,255,.04)}
.jug-log-row:last-child{border-bottom:none}
.jug-log-pr{color:#FFD700;font-weight:700}
.jug-goal{font-size:.73em;color:rgba(255,255,255,.28);text-align:center}
/* juggling leaderboard */
.jug-lb-title{font-size:.75em;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:#7fbfff;margin:18px 0 8px}
.jug-lb-row{display:flex;align-items:center;gap:10px;padding:7px 10px;background:rgba(255,255,255,.04);border-radius:8px;margin-bottom:6px}
.jug-lb-rank{font-size:.8em;width:20px;text-align:center;flex-shrink:0}
.jug-lb-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.jug-lb-name{flex:1;font-size:.83em;font-weight:700}
.jug-lb-pr{font-size:.8em;font-weight:800;color:#FFD700}
.jug-lb-days{font-size:.7em;color:rgba(255,255,255,.35);margin-left:4px}

/* ── DAY STRIP ── */
.day-strip{display:flex;gap:5px;margin-bottom:12px}
.day-bubble{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 2px;border-radius:10px;cursor:pointer;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);transition:all .15s;min-width:0}
.day-bubble.today{border-color:rgba(255,215,0,.45);background:rgba(255,215,0,.07)}
.day-bubble.selected{border-color:rgba(255,255,255,.45);background:rgba(255,255,255,.1)}
.day-bubble.future{opacity:.28;pointer-events:none}
.day-bubble-lbl{font-size:.58em;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:rgba(255,255,255,.38)}
.day-bubble.today .day-bubble-lbl{color:#FFD700}
.day-bubble.selected .day-bubble-lbl{color:#fff}
.day-bubble-dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:.55em;font-weight:900;transition:all .15s}
.day-bubble.complete .day-bubble-dot{background:#27ae60;border-color:#27ae60;color:#fff}
.day-bubble.partial .day-bubble-dot{background:rgba(255,193,7,.3);border-color:rgba(255,193,7,.55);color:rgba(255,193,7,.9)}
.day-viewing-label{font-size:.72em;color:rgba(255,255,255,.35);text-align:center;margin-bottom:10px;font-weight:600}
.day-viewing-label span{color:rgba(255,255,255,.7)}
.day-readonly .daily-item{pointer-events:none;opacity:.7}
/* streak */
.streak-bar{display:flex;align-items:center;gap:10px;padding:9px 13px;background:rgba(255,140,0,.1);border:1px solid rgba(255,140,0,.3);border-radius:10px;margin-bottom:12px}
.streak-fire{font-size:1.3em}
.streak-num{font-size:1.15em;font-weight:900;color:#FF8C00}
.streak-lbl{font-size:.75em;color:rgba(255,255,255,.45);flex:1}
.streak-best{font-size:.68em;color:rgba(255,140,0,.5)}
/* juggling team card */
.jug-team-today{font-size:.68em;padding:2px 7px;border-radius:5px;font-weight:700;background:rgba(255,215,0,.12);color:#FFD700;margin-left:4px}

/* ── PLAYER PROFILE EDITOR ── */
.profile-editor{display:none;padding:10px 14px 14px;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.08)}
.profile-editor.open{display:block}
.profile-editor-title{font-size:.7em;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:10px}
.profile-fields{display:flex;gap:8px;align-items:flex-end}
.profile-field{flex:1;display:flex;flex-direction:column;gap:4px}
.profile-field label{font-size:.67em;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.35)}
.profile-input{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:8px;color:#fff;font-size:.9em;padding:7px 10px;outline:none;width:100%;box-sizing:border-box}
.profile-input:focus{border-color:rgba(255,215,0,.5)}
.profile-save-btn{background:rgba(255,215,0,.18);border:1px solid rgba(255,215,0,.4);color:#FFD700;font-weight:800;font-size:.78em;padding:7px 13px;border-radius:8px;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:background .15s}
.profile-save-btn:hover{background:rgba(255,215,0,.32)}
.profile-edit-btn{background:none;border:none;color:rgba(255,255,255,.3);font-size:.85em;cursor:pointer;padding:2px 6px;transition:color .15s;flex-shrink:0}
.profile-edit-btn:hover{color:rgba(255,255,255,.7)}
.lb-jersey{font-size:.68em;font-weight:800;background:rgba(255,255,255,.1);color:rgba(255,255,255,.55);padding:1px 5px;border-radius:4px;margin-right:4px}
.lb-realname{font-size:.72em;color:rgba(255,255,255,.32);font-weight:400;margin-left:3px}

/* ── DAY BUBBLE DATE NUMBER ── */
.day-bubble-date{font-size:.78em;font-weight:700;color:rgba(255,255,255,.5);margin:1px 0 2px;line-height:1}
.day-bubble.today .day-bubble-date{color:#FFD700}
.day-bubble.selected .day-bubble-date{color:#fff;font-weight:900}

/* ── JUGGLING ENHANCEMENTS ── */
.jug-log-sel{background:rgba(255,215,0,.1);border-radius:4px}
.jug-log-count{font-weight:800}
.jug-no-log{text-align:center;color:rgba(255,255,255,.3);font-size:.8em;padding:10px 0;font-style:italic}
.jug-today-count{font-size:.85em;color:rgba(255,255,255,.6);padding:5px 0 2px;text-align:center}
.jug-today-count strong{color:#FFD700;font-size:1.15em}
.jug-log-date{flex:1;color:rgba(255,255,255,.6);font-size:.83em;font-weight:600}
.jug-log-count{font-size:.9em;font-weight:900;color:#FFD700;min-width:60px;text-align:right}
.jug-log-row{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border-radius:6px;margin-bottom:3px;background:rgba(255,255,255,.03)}

/* ── JUGGLING CHART & ENHANCED SECTION ── */
.jug-chart-outer{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:8px 0 4px;margin-bottom:6px}
.jug-chart-outer::-webkit-scrollbar{display:none}
.jug-chart-title{font-size:.65em;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:rgba(255,255,255,.22);margin-bottom:2px}
.jug-streak-row{display:flex;align-items:center;gap:6px;padding:6px 10px;background:rgba(255,140,0,.08);border:1px solid rgba(255,140,0,.22);border-radius:8px;margin-bottom:10px}
.jug-del-btn{background:rgba(255,80,80,.13);border:1px solid rgba(255,80,80,.28);color:rgba(255,110,110,.8);font-size:.8em;padding:7px 10px;border-radius:8px;cursor:pointer;flex-shrink:0;transition:background .15s}
.jug-del-btn:hover{background:rgba(255,80,80,.28)}
.jug-pr-note{font-size:.74em;color:#FFD700;text-align:center;padding:2px 0 6px;font-weight:700}

/* ── STREAK LEADERBOARD ── */
.streak-lb{margin-bottom:16px}
.streak-lb-row{display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(255,255,255,.04);border-radius:8px;margin-bottom:4px}
.streak-lb-row.me{background:rgba(255,215,0,.08);border:1px solid rgba(255,215,0,.2)}
.streak-lb-rank{font-size:1.1em;min-width:28px;text-align:center}
.streak-lb-name{flex:1;font-size:.88em;font-weight:700}
.streak-lb-val{font-size:.82em;color:rgba(255,200,100,.9);white-space:nowrap}

/* ── DRILL LB DAILY PROGRESS ── */
.lb-daily-prog{display:flex;gap:12px;margin-top:3px}
.lbdp-bs,.lbdp-st{font-size:.72em;color:rgba(255,255,255,.42)}

/* ── JUGGLING LEADERBOARD (TEAM TAB) ── */
.jug-lb{margin:4px 0 20px}
.jug-lb-row{display:flex;align-items:center;gap:8px;padding:9px 10px;background:rgba(255,255,255,.04);border-radius:8px;margin-bottom:4px}
.jug-lb-row.me{background:rgba(255,215,0,.08);border:1px solid rgba(255,215,0,.2)}
.jug-lb-rank{font-size:1.1em;min-width:28px;text-align:center}
.jug-lb-inf{flex:1;min-width:0}
.jug-lb-name{font-size:.88em;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jug-lb-days{font-size:.72em;color:rgba(255,255,255,.4);display:block}
.jug-lb-pr{font-size:1.15em;font-weight:900;color:#FFD700;white-space:nowrap;min-width:38px;text-align:right}
.jug-no-pr{color:rgba(255,255,255,.2)!important}
.jug-new-pr{font-size:.68em;background:#e74c3c;color:#fff;padding:1px 5px;border-radius:4px;font-weight:800;vertical-align:middle;margin-left:4px}
.team-empty{text-align:center;color:rgba(255,255,255,.3);font-size:.82em;padding:10px;margin-bottom:12px;font-style:italic}

/* ── PLAYER CARD ENHANCEMENTS ── */
.pc-jersey-badge{font-size:.72em;font-weight:900;color:rgba(255,255,255,.5);margin-top:-4px;letter-spacing:.02em}
.pc-realname{font-size:.7em;color:rgba(255,255,255,.4);margin-top:2px}
.pc-av{font-size:1em}

/* ── ACTIVITY GRID ── */
.overall-bar{display:block}
#drill-list{display:none}
.ag-week-nav{display:flex;align-items:center;justify-content:space-between;padding:10px 0 12px;gap:8px}
.ag-nav-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;padding:6px 14px;border-radius:20px;font-size:.78em;font-weight:700;cursor:pointer;white-space:nowrap;transition:background .15s}
.ag-nav-btn:hover{background:rgba(255,255,255,.18)}
.ag-week-label{font-size:.88em;font-weight:800;color:#FFD700;text-align:center;flex:1}
.ag-table{width:100%;border-collapse:collapse;margin-bottom:14px}
.ag-day-header{font-size:.72em;font-weight:800;text-align:center;padding:4px 3px 8px;color:rgba(255,255,255,.45);min-width:40px}
.ag-day-header.today{color:#FFD700}
.ag-day-header.today .ag-date-num{background:#FFD700;color:#0d1b2a;border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center}
.ag-date-num{display:block;font-size:.95em;font-weight:900;margin-top:1px}
.ag-section-row td{padding:10px 0 4px;font-size:.7em;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.35)}
.ag-label-cell{padding:5px 12px 5px 0;vertical-align:middle;white-space:nowrap}
.ag-label-name{display:block;font-size:.8em;font-weight:700;color:rgba(255,255,255,.8)}
.ag-label-target{display:block;font-size:.68em;color:rgba(255,255,255,.35);margin-top:1px}
.ag-check-cell{text-align:center;padding:3px 2px;vertical-align:middle}
.ag-check{width:26px;height:26px;border-radius:7px;border:2px solid rgba(255,255,255,.18);display:inline-flex;align-items:center;justify-content:center;font-size:.85em;font-weight:900;transition:all .15s;cursor:pointer;color:transparent;background:rgba(255,255,255,.03)}
.ag-check.done{border-color:#27AE60;background:rgba(39,174,96,.25);color:#4CD97A}
.ag-check.future{border-color:rgba(255,255,255,.08);background:rgba(255,255,255,.02);cursor:default;opacity:.4}
.ag-check:not(.done):not(.future):hover{border-color:rgba(255,255,255,.45);background:rgba(255,255,255,.08)}
.ag-row:hover .ag-label-name{color:#fff}

:root{--az-blue:#0EA5E9;--az-blue-dim:rgba(14,165,233,.18);--az-green:#22C55E;--az-dark:#000;--az-border:rgba(255,255,255,.09);}
body{background:var(--az-dark);}
.ob-fill{background:linear-gradient(90deg,#0EA5E9,#38BDF8);}
.tab-btn.active{color:#0EA5E9;border-bottom-color:#0EA5E9;}
.streak-num{color:#0EA5E9;}
.app-hdr-logo{height:44px;width:auto;opacity:1;flex-shrink:0;margin-right:6px}
.sel-logo-wrap{text-align:center;padding:16px 0 8px}
.sel-logo-wrap img{width:min(66%,280px);height:auto;opacity:1;display:block;margin:0 auto}

.summer-strip{display:flex;align-items:flex-start;gap:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:24px 0 8px}
.summer-strip::-webkit-scrollbar{display:none}
.sum-week-group{display:flex;flex-direction:column;align-items:stretch;flex-shrink:0}
.sum-week-lbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.5);padding:0 5px 7px 5px;white-space:nowrap;text-align:center}
.sum-week-days{display:flex;gap:4px;padding:0 5px}
.sum-month-sep{width:1px;background:rgba(255,255,255,.15);margin:22px 5px 0;align-self:stretch;flex-shrink:0}
.sum-pill-wrap{display:flex;flex-direction:column;align-items:center;flex-shrink:0}
.sum-today-arrow{font-size:13px;color:#FFD700;margin-bottom:2px;line-height:1;height:16px;display:flex;align-items:center;justify-content:center;visibility:hidden}
.sum-today-arrow.show{visibility:visible}
.sum-pill{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 5px 5px;border-radius:9px;background:rgba(255,255,255,.06);cursor:pointer;min-width:39px;max-width:39px;transition:all .12s;border:2px solid rgba(255,255,255,.22)}
.sum-pill:hover{background:rgba(255,255,255,.1)}
.sum-pill.complete{border-color:#22C55E}
.sum-pill.partial{border-color:#FFD700}
.sum-pill.today{background:rgba(255,255,255,.1)}
.sum-pill.future{border-color:rgba(255,255,255,.1);opacity:.32;cursor:default;pointer-events:none}
.sum-pill.sel{outline:2px solid #0EA5E9;outline-offset:2px}
.sum-day-abbr{font-size:11px;font-weight:700;text-transform:uppercase;color:rgba(255,255,255,.5);letter-spacing:.02em}
.sum-day-num{font-size:17px;font-weight:800;color:rgba(255,255,255,.8);line-height:1}
.sum-pill.today .sum-day-num{color:#FFD700;font-weight:900}
.sum-pill.future .sum-day-num{color:rgba(255,255,255,.4)}
.sum-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.18)}
.sum-dot.done{background:#22C55E}
.sum-dot.partial{background:#FFD700}
.sum-jug{font-size:11px;font-weight:800;margin-top:3px;height:16px;display:flex;align-items:center;justify-content:center;color:transparent}
.sum-jug.has-jug{color:#0EA5E9}
.sum-slider-wrap{display:flex;align-items:center;gap:8px;padding:6px 0 4px}
.sum-slider-lbl{font-size:12px;color:rgba(255,255,255,.35);cursor:pointer;user-select:none;flex-shrink:0}
.sum-track{flex:1;position:relative;height:5px;background:rgba(255,255,255,.1);border-radius:3px;cursor:pointer}
.sum-track-fill{position:absolute;left:0;top:0;height:100%;background:rgba(255,255,255,.3);border-radius:3px}
.sum-thumb{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:#0EA5E9;transform:translate(-50%,-50%);cursor:grab;box-shadow:0 0 0 3px rgba(14,165,233,.25)}

.jug-input-sm{width:68px!important;flex:none!important;font-size:1.1em!important}
.cde-section{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:13px 14px;margin-bottom:14px}
.cde-hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cde-title{font-weight:800;font-size:.88em;flex:1}
.cde-input-wrap{margin-bottom:10px}
.cde-textarea{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:8px;color:#fff;font-size:.85em;padding:8px 10px;resize:none;outline:none;font-family:inherit;line-height:1.5}
.cde-textarea:focus{border-color:#0EA5E9}
.cde-actions{display:flex;align-items:center;gap:8px;margin-top:7px}
.cde-photo-lbl{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:7px;padding:6px 11px;font-size:.78em;color:rgba(255,255,255,.7);cursor:pointer;font-weight:600;transition:background .15s}
.cde-photo-lbl:hover{background:rgba(255,255,255,.14)}
.cde-submit-btn{margin-left:auto;background:var(--az-blue-dim);border:1px solid rgba(14,165,233,.4);color:#0EA5E9;font-weight:800;font-size:.78em;padding:7px 14px;border-radius:7px;cursor:pointer}
.cde-submit-btn:hover{background:rgba(14,165,233,.3)}
.cde-entry{background:rgba(255,255,255,.04);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.cde-entry-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cde-entry-date{font-size:.7em;color:rgba(255,255,255,.35);font-weight:700}
.cde-del-btn{background:none;border:none;color:rgba(255,255,255,.22);font-size:.85em;cursor:pointer;padding:0 2px}
.cde-del-btn:hover{color:rgba(255,80,80,.8)}
.cde-photo-img{width:100%;border-radius:6px;margin-bottom:6px;max-height:220px;object-fit:cover}
.cde-entry-text{font-size:.82em;color:rgba(255,255,255,.75);line-height:1.55}
.cde-empty{font-size:.78em;color:rgba(255,255,255,.25);text-align:center;padding:8px 0;font-style:italic}
.cde-log-hdr{font-size:.65em;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:rgba(255,255,255,.25);padding:10px 0 6px}
.cde-log-list{display:flex;flex-direction:column;gap:0}
.cde-log-list .cde-entry{border-bottom:1px solid rgba(255,255,255,.05);border-radius:0;background:none;padding:8px 2px}
.cde-log-list .cde-entry:last-child{border-bottom:none}

.color-picker-row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.color-picker-lbl{font-size:.67em;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.32);width:100%}
.color-swatch{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;flex-shrink:0;transition:all .15s}
.color-swatch.sel{border-color:#fff;transform:scale(1.2)}
.pc-badge{display:inline-flex;align-items:center;gap:3px;font-size:.62em;font-weight:800;padding:2px 6px;border-radius:5px;margin-top:3px}
.pc-badge-jug{background:rgba(255,215,0,.14);color:#FFD700}
.pc-badge-streak{background:rgba(255,120,0,.14);color:#FF8C00}

/* ── UNIFIED LEADERBOARD CARDS ── */
.lb-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:13px 14px;margin-bottom:10px;transition:border-color .15s}
.lb-card.me{border-color:rgba(14,165,233,.35);background:rgba(14,165,233,.04)}
.lb-card.rank-1{border-color:rgba(255,215,0,.3);background:rgba(255,215,0,.04)}
.lb-card.rank-2{border-color:rgba(192,192,192,.18)}
.lb-card.rank-3{border-color:rgba(205,127,50,.18)}
.lb-card-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.lb-card-rank{font-size:18px;min-width:24px;text-align:center;flex-shrink:0;line-height:1}
.lb-card-rank.num{font-size:14px;font-weight:800;color:rgba(255,255,255,.28)}
.lb-card-av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.95em;color:#fff;flex-shrink:0}
.lb-card-name-col{flex:1;min-width:0}
.lb-card-name{font-weight:800;font-size:.95em;color:#fff}
.lb-card-sub{font-size:.7em;color:rgba(255,255,255,.32);margin-top:1px}
.lb-jug-badge{display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0}
.lb-jug-num{font-size:1.35em;font-weight:900;color:#0EA5E9;line-height:1}
.lb-jug-num.none{color:rgba(255,255,255,.2);font-size:1.1em}
.lb-jug-days{display:flex;gap:6px;align-items:baseline;justify-content:flex-end;margin-bottom:3px}
.lb-jug-pr-num{font-size:1.5em;font-weight:900;color:#FFD700;line-height:1}
.lb-jug-recent{font-size:1em;font-weight:700;color:rgba(255,255,255,.55);line-height:1}
.lb-jug-older{font-size:.85em;font-weight:500;color:rgba(255,255,255,.25);line-height:1}
.lb-jug-dot{font-size:.7em;color:rgba(255,255,255,.15);align-self:center}

.lb-jug-lbl{font-size:.58em;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:rgba(14,165,233,.5);margin-top:2px}
.lb-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lb-stat{background:rgba(255,255,255,.04);border-radius:8px;padding:7px 10px}
.lb-stat-lbl{font-size:.6em;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.28);margin-bottom:4px}
.lb-stat-val{font-size:.88em;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-stat-val.gold{color:#FFD700}
.lb-stat-val.green{color:#22C55E}
.lb-stat-val.dim{color:rgba(255,255,255,.28);font-weight:500;font-style:italic;font-size:.82em}
.lb-stat-val.cde-text{color:rgba(255,255,255,.75);font-weight:600;font-size:.82em;white-space:normal;line-height:1.35}
.lb-mini-bar-wrap{height:4px;background:rgba(255,255,255,.1);border-radius:2px;margin-top:5px;overflow:hidden}
.lb-mini-bar{height:100%;border-radius:2px}
.lb-page-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.35);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.08)}

/* ── SUMMER CONSISTENCY BAR ── */
.overall-bar{background:rgba(255,255,255,.06);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.sc-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.sc-title{font-size:.72em;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:#0EA5E9}
.sc-countdown{font-size:.72em;font-weight:700;color:rgba(255,255,255,.45)}
.sc-countdown span{color:#FFD700;font-weight:900}
.sc-bar-wrap{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:1px;margin-bottom:8px;background:rgba(255,255,255,.06)}
.sc-seg-active{background:#0EA5E9;border-radius:2px;transition:width .5s}
.sc-seg-inactive{background:rgba(255,255,255,.12);border-radius:2px}

.lb-table td:last-child{border-right:none}

function todayStr(){return new Date().toISOString().split('T')[0];}
function pacificTodayStr(){
  try{return new Date().toLocaleDateString('en-CA',{timeZone:'America/Los_Angeles'});}
  catch(e){return new Date().toISOString().split('T')[0];}
}
const PROGRAM_START='2026-05-30';
const PROGRAM_END='2026-07-31';
function getSummerDays(){
  var days=[];var d=new Date(PROGRAM_START+'T12:00:00');
  var end=new Date(PROGRAM_END+'T12:00:00');
  while(d<=end){days.push(d.toISOString().split('T')[0]);d.setDate(d.getDate()+1);}
  return days;
}

}
function getPlayerStrength(n){

}
function getCDEKey(n){return STORE_KEY+'_cde_'+n.replace(/\s+/g,'_');}

function saveCDEJournal(n,entries){localStorage.setItem(getCDEKey(n),JSON.stringify(entries));}
function addCDEEntry(){
  var txt=document.getElementById('cde-text');
  var fileInp=document.getElementById('cde-photo');
  var text=(txt?txt.value.trim():'');
  if(!text&&!(fileInp&&fileInp.files&&fileInp.files[0])){showToast('Add a note or photo first');return;}
  var today=pacificTodayStr();
  var entry={id:Date.now(),date:today,text:text||'',photo:null};
  function doSave(e){
    var entries=getCDEJournal(state.current);entries.unshift(e);saveCDEJournal(state.current,entries);
    sheetsPost({team:TEAM_ID,player:state.current,type:'cde',data:{id:e.id,date:e.date,text:e.text}});
    if(txt)txt.value='';if(fileInp)fileInp.value='';renderDailyModules();showToast('Activity logged!');
  }
  if(fileInp&&fileInp.files&&fileInp.files[0]){
    var reader=new FileReader();
    reader.onload=function(ev){entry.photo=ev.target.result;doSave(entry);};
    reader.onerror=function(){doSave(entry);};
    reader.readAsDataURL(fileInp.files[0]);
  }else{doSave(entry);}
}
function deleteCDEEntry(id){
  if(!confirm('Remove this journal entry?'))return;
  var entries=getCDEJournal(state.current).filter(function(e){return e.id!==id;});
  saveCDEJournal(state.current,entries);
  sheetsPost({team:TEAM_ID,player:state.current,type:'cde_delete',data:{id:id}});
  renderDailyModules();
}

  return jd.log.filter(function(e){return new Date(e.date+'T12:00:00')>=start;}).length;
}
function getDailyKey(n){return STORE_KEY+'_d_'+n.replace(/\s+/g,'_');}
function getJugKey(n){return STORE_KEY+'_j_'+n.replace(/\s+/g,'_');}
function getDailyHistory(n){
  try{return JSON.parse(localStorage.getItem(getDailyKey(n))||'{}');}
  catch(e){return{};}
}
function getDayData(n,ds){var h=getDailyHistory(n);return h[ds]||{bs:[],st:[]};}
function saveDayData(n,ds,data){var h=getDailyHistory(n);h[ds]=data;localStorage.setItem(getDailyKey(n),JSON.stringify(h));var _d={};_d[ds]=data;sheetsPost({team:TEAM_ID,player:n,type:'daily',data:_d});}
function isDayComplete(n,ds){var d=getDayData(n,ds);var bs=getPlayerBallSkills(n);var st=getPlayerStrength(n);return d.bs.length===bs.length&&d.st.length===st.length;}
function isDayPartial(n,ds){var d=getDayData(n,ds);return(d.bs.length+d.st.length)>0&&!isDayComplete(n,ds);}
function getStreak(n){
  var streak=0;
  // Start from YESTERDAY — today is ongoing so doesn't count toward streak yet
  var base=new Date(pacificTodayStr()+'T12:00:00');
  base.setDate(base.getDate()-1);
  for(var i=0;i<200;i++){
    var ds=new Date(base.getTime()-i*86400000).toISOString().split('T')[0];
    if(isDayComplete(n,ds))streak++;else break;
  }
  return streak;
}
function getBestStreak(n){
  var h=getDailyHistory(n);var dates=Object.keys(h).sort();
  var best=0;var cur=0;var prev=null;
  dates.forEach(function(ds){
    if(isDayComplete(n,ds)){
      if(prev){var diff=(new Date(ds)-new Date(prev))/(1000*86400);cur=diff<=1?cur+1:1;}
      else{cur=1;}
      if(cur>best)best=cur;prev=ds;
    }else{cur=0;prev=null;}
  });
  return best;
}
function getJugStreak(n){
  var jd=getJugData(n);
  var dates=jd.log.map(function(e){return e.date;});
  var streak=0;
  var base=new Date(pacificTodayStr()+'T12:00:00');
  base.setDate(base.getDate()-1); // start from yesterday
  for(var i=0;i<365;i++){
    var ds=new Date(base.getTime()-i*86400000).toISOString().split('T')[0];
    if(dates.indexOf(ds)>-1){streak++;}else{break;}
  }
  return streak;
}
function getBestJugStreak(n){
  var jd=getJugData(n);
  if(!jd.log.length)return 0;
  var dates=jd.log.map(function(e){return e.date;}).sort();
  var best=0;var cur=0;var prev=null;
  dates.forEach(function(ds){
    if(prev){var diff=(new Date(ds)-new Date(prev))/86400000;cur=(diff<=1)?cur+1:1;}
    else{cur=1;}
    if(cur>best)best=cur;prev=ds;
  });
  return best;
}
function buildJugChart(jd,today){
  if(!jd.log.length)return '<div style="text-align:center;padding:14px 0 8px;color:rgba(255,255,255,.26);font-size:.78em;font-style:italic">No juggling logged yet — start your streak! 🎯</div>';
  var allDays=[];
  for(var i=27;i>=0;i--){
    var ds=new Date(new Date().getTime()-i*86400000).toISOString().split('T')[0];
    var entry=jd.log.find(function(e){return e.date===ds;});
    allDays.push({date:ds,count:entry?entry.count:0});
  }
  var firstNZ=allDays.findIndex(function(d){return d.count>0;});
  if(firstNZ<0)firstNZ=allDays.length-1;
  var days=allDays.slice(Math.max(0,firstNZ-1));
  var pr=jd.pr||1;
  var maxCount=Math.max(pr,1);
  var BAR_W=32;var BAR_GAP=4;
  var CHART_H=72;var LABEL_H=20;var COUNT_H=16;var TOP_PAD=4;
  var TOTAL_H=TOP_PAD+COUNT_H+CHART_H+LABEL_H;
  var totalW=Math.max(days.length*(BAR_W+BAR_GAP)-BAR_GAP,1);
  var bars='';
  days.forEach(function(d,i){
    var x=i*(BAR_W+BAR_GAP);
    var barH=d.count>0?Math.max(4,Math.round(d.count/maxCount*CHART_H)):0;
    var barY=TOP_PAD+COUNT_H+(CHART_H-barH);
    var isToday=d.date===today;
    var isPR=d.count>0&&d.count===pr;
    var barColor=isPR?'url(#prGrad)':isToday&&d.count>0?'#4fc3f7':d.count>0?'rgba(100,180,255,.7)':'rgba(255,255,255,.05)';
    var dateObj=new Date(d.date+'T12:00:00');
    var dayLbl=(dateObj.getMonth()+1)+'/'+(dateObj.getDate());
    bars+='<g>';
    if(barH>0){
      bars+='<rect x="'+x+'" y="'+barY+'" width="'+BAR_W+'" height="'+barH+'" rx="4" fill="'+barColor+'" />';
      bars+='<text x="'+(x+BAR_W/2)+'" y="'+(barY-3)+'" text-anchor="middle" font-size="9" fill="'+(isPR?'#FFD700':'rgba(255,255,255,.65)')+'" font-weight="'+(isPR?'900':'600')+'">'+d.count+'</text>';
    }else{
      bars+='<rect x="'+x+'" y="'+(TOP_PAD+COUNT_H+CHART_H-3)+'" width="'+BAR_W+'" height="3" rx="1.5" fill="rgba(255,255,255,.07)" />';
    }
    bars+='<text x="'+(x+BAR_W/2)+'" y="'+(TOP_PAD+COUNT_H+CHART_H+LABEL_H-4)+'" text-anchor="middle" font-size="9" fill="'+(isToday?'#FFD700':'rgba(255,255,255,.25)')+'">'+dayLbl+'</text>';
    if(isToday){bars+='<circle cx="'+(x+BAR_W/2)+'" cy="'+(TOP_PAD+COUNT_H+CHART_H+LABEL_H-15)+'" r="2.5" fill="#FFD700" />';}
    bars+='</g>';
  });
  var prLineY=TOP_PAD+COUNT_H;
  return '<div class="jug-chart-title">Juggle history — last 28 days</div>'
    +'<div class="jug-chart-outer" id="jug-chart-outer"><svg width="'+totalW+'" height="'+TOTAL_H+'" xmlns="http://www.w3.org/2000/svg">'
    +'<defs><linearGradient id="prGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFD700"/><stop offset="100%" stop-color="#FF8C00"/></linearGradient></defs>'
    +'<line x1="0" y1="'+prLineY+'" x2="'+totalW+'" y2="'+prLineY+'" stroke="rgba(255,215,0,.18)" stroke-dasharray="3,3" stroke-width="1"/>'
    +(pr>0?'<text x="2" y="'+(prLineY+10)+'" font-size="8" fill="rgba(255,215,0,.45)" font-weight="700">PR '+pr+'</text>':'')
    +bars+'</svg></div>';
}

  return `<polygon points="${x},${y-14} ${x-9},${y+9} ${x+9},${y+9}" fill="#FF6B00" stroke="#FF9A3C" stroke-width="1.5"/>
          <rect x="${x-9}" y="${y+9}" width="18" height="3" fill="#cc4400" rx="1"/>`;
}
function sPlayer(x,y,col='#4A9EFF',lbl=''){
  return `<circle cx="${x}" cy="${y}" r="15" fill="${col}" stroke="rgba(255,255,255,.55)" stroke-width="2.5"/>
          ${lbl?`<text x="${x}" y="${y+5}" text-anchor="middle" font-size="10" font-weight="bold" fill="white" font-family="Arial">${lbl}</text>`:''}`;
}
function sBall(x,y){
  return `<circle cx="${x}" cy="${y}" r="9" fill="white" stroke="#555" stroke-width="1.5"/>
          <path d="M${x},${y-9}A9,9,0,0,1,${x+9},${y}" stroke="#aaa" stroke-width=".8" fill="none"/>
          <path d="M${x+9},${y}A9,9,0,0,1,${x},${y+9}" stroke="#aaa" stroke-width=".8" fill="none"/>`;
}
function sGoal(cx,y,w=72){
  return `<rect x="${cx-w/2}" y="${y}" width="${w}" height="16" fill="rgba(255,255,255,.1)" stroke="white" stroke-width="2"/>`;
}
function sDefender(x,y){
  return `<circle cx="${x}" cy="${y}" r="15" fill="#cc2222" stroke="rgba(255,255,255,.4)" stroke-width="2.5"/>
          <text x="${x}" y="${y+5}" text-anchor="middle" font-size="14" fill="white" font-family="Arial">?</text>`;
}
function sArrow(x1,y1,x2,y2,col='#FFD700',delay=0,len=300){
  const dx=x2-x1,dy=y2-y1,l=Math.sqrt(dx*dx+dy*dy)||1;
  const ux=dx/l,uy=dy/l,nx=-uy,ny=ux,hs=9;
  const ax=x2-ux*hs,ay=y2-uy*hs;
  const cls=`ap${delay>0?delay:''}`;
  return `<line x1="${x1}" y1="${y1}" x2="${ax}" y2="${ay}" stroke="${col}" stroke-width="3" stroke-linecap="round" class="${cls}" style="--len:${len}"/>
          <polygon points="${x2},${y2} ${ax+nx*hs*.6},${ay+ny*hs*.6} ${ax-nx*hs*.6},${ay-ny*hs*.6}" fill="${col}"/>`;
}
function sDashed(pts,col='rgba(255,80,80,.75)',delay=0,len=300){
  const d=pts.map((p,i)=>`${i?'L':'M'}${p[0]},${p[1]}`).join('');
  const cls=`ap${delay>0?delay:''}`;
  return `<path d="${d}" stroke="${col}" stroke-width="2.5" fill="none" stroke-dasharray="8 5" stroke-linecap="round" class="${cls}" style="--len:${len}"/>`;
}
function sPath(pts,col='#FFD700',delay=0,len=500){
  const d=pts.map((p,i)=>`${i?'L':'M'}${p[0]},${p[1]}`).join('');
  const cls=`ap${delay>0?delay:''}`;
  return `<path d="${d}" stroke="${col}" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" class="${cls}" style="--len:${len}"/>`;
}
function sLabel(x,y,txt,col='rgba(255,255,255,.6)',sz=9.5){
  return `<text x="${x}" y="${y}" text-anchor="middle" font-size="${sz}" fill="${col}" font-family="Arial" font-weight="bold">${txt}</text>`;
}
function sBox(x,y,w,h,col='rgba(255,255,255,.25)'){
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="rgba(255,255,255,.04)" stroke="${col}" stroke-width="2" stroke-dasharray="8 4" rx="2"/>`;
}
function sFakeArrow(x1,y1,x2,y2,delay=0){
  return sDashed([[x1,y1],[x2,y2]],'rgba(255,80,80,.8)',delay,200)

const STORE_KEY = 'azzurri_storm_v2';
const TEAM_ID = 'u11';
let state = { current: null, players: {}, selDay: null };
let modalDrillId = null;

function loadState(){
  try{ state = JSON.parse(localStorage.getItem(STORE_KEY)) || { current:null, players:{} }; }
  catch(e){ state = { current:null, players:{} }; }
  if(!state.players) state.players = {};
}
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){}
}
function playerProgress(name){
  return state.players[name] || {};
}
function drillsDone(name){
  const p = playerProgress(name);
  return DRILLS.filter(d=>p[d.id]).length;
}
function toggleDrill(id){
  const p = state.players[state.current] || {};
  p[id] = !p[id];
  state.players[state.current] = p;
  saveState();
  renderTraining();
  renderTeam();
  updateHeader();
  updatePlayerCard(state.current);
}

// ══════════════════════════════════════════════
//  ENCODING / SHARING
// ══════════════════════════════════════════════
function encodeProgress(name){
  const p = playerProgress(name);
  // 41 drills → 6 bytes bitmask
  const bytes = new Uint8Array(6);
  DRILLS.forEach((d,i)=>{ if(p[d.id]) bytes[Math.floor(i/8)] |= (1<<(i%8)); });
  const b64 = btoa(String.fromCharCode(...bytes));
  return name + ':' + b64.replace(/=/g,'');
}
function decodeProgress(code){
  try{
    const sep = code.indexOf(':');
    if(sep<1) return null;
    const name = code.substring(0,sep).trim();
    const b64 = code.substring(sep+1).trim();
    const bin = atob(b64.padEnd(b64.length+((4-b64.length%4)%4),'='));
    const bytes = new Uint8Array([...bin].map(c=>c.charCodeAt(0)));
    const result = {};
    DRILLS.forEach((d,i)=>{ if(bytes[Math.floor(i/8)] & (1<<(i%8))) result[d.id]=true; });
    return { name, progress: result };
  } catch(e){ return null; }
}

// ══════════════════════════════════════════════
//  RENDER: PLAYER SELECTOR
// ══════════════════════════════════════════════
function renderSelector(){
  var grid=document.getElementById('player-grid');
  var today=pacificTodayStr();
  var allPRs=PLAYERS.map(function(p){return{name:p.name,pr:getJugData(p.name).pr};});
  var maxPR=Math.max.apply(null,allPRs.map(function(x){return x.pr;}));
  var topJugglers=maxPR>0?allPRs.filter(function(x){return x.pr===maxPR;}).map(function(x){return x.name;}):[]; 
  var allStreaks=PLAYERS.map(function(p){return{name:p.name,streak:getStreak(p.name)};});
  var maxStreak=Math.max.apply(null,allStreaks.map(function(x){return x.streak;}));
  var topStreakers=maxStreak>0?allStreaks.filter(function(x){return x.streak===maxStreak;}).map(function(x){return x.name;}):[]; 
  var sorted=[...PLAYERS].sort(function(a,b){
    var ja=getJerseyNum(a.name),jb=getJerseyNum(b.name);
    if(ja&&jb)return parseInt(ja)-parseInt(jb);
    if(ja)return -1;if(jb)return 1;return 0;
  });
  grid.innerHTML=sorted.map(function(p){
    var nick=getDisplayName(p.name);
    var jersey=getJerseyNum(p.name);
    var custColor=getPlayerColor(p.name);
    var avColor=custColor||p.color;
    var avContent=jersey?jersey:p.name.charAt(0).toUpperCase();
    var isTopJug=topJugglers.indexOf(p.name)>-1;
    var isTopStreak=topStreakers.indexOf(p.name)>-1;
    var badges=(isTopJug?'<div class="pc-badge pc-badge-jug">🏆 Juggling Record</div>':'')
              +(isTopStreak?'<div class="pc-badge pc-badge-streak">🔥 Longest Streak</div>':'');

    // Real progress: today's BS+ST and overall streak
    var myBS=getPlayerBallSkills(p.name);
    var myST=getPlayerStrength(p.name);
    var todayData=getDayData(p.name,today);
    var bsDone=todayData.bs.length,stDone=todayData.st.length;
    var totalItems=myBS.length+myST.length;
    var todayDone=bsDone+stDone;
    var todayPct=totalItems>0?Math.round(todayDone/totalItems*100):0;
    var streak=getStreak(p.name);

    // Status label
    var statusLabel,statusColor;
    if(isDayComplete(p.name,today)){
      statusLabel='✅ Complete today';statusColor='#22C55E';
    }else if(todayDone>0){
      statusLabel='⚡ '+todayDone+'/'+totalItems+' done today';statusColor='#FFD700';
    }else if(streak>0){
      statusLabel='🔥 '+streak+' day streak';statusColor='#FF8C00';
    }else{
      // Check if they have ANY history at all
      var hist=getDailyHistory(p.name);
      var hasPast=Object.keys(hist).length>0;
      var jugPR=getJugData(p.name).pr;
      statusLabel=hasPast||jugPR>0?'Active this summer':'Not started yet';
      statusColor='rgba(255,255,255,.35)';
    }

    return '<div class="pc" onclick="selectPlayer(\''+p.name+'\')">'
      +'<div class="pc-av" style="background:'+avColor+'">'+avContent+'</div>'
      +'<div class="pc-name">'+nick+'</div>'
      +(jersey?'<div class="pc-jersey-badge">#'+jersey+'</div>':'')
      +badges
      +'<div class="pc-bar-wrap"><div class="pc-bar" style="width:'+todayPct+'%;background:'+avColor+'"></div></div>'

function renderTraining(){
  const prog = playerProgress(state.current);
  const done = drillsDone(state.current);
  const pct = Math.round(done/41*100);

  
  

  // Group drills by week
  const weeks = [1,2,3];
  const dayOrder = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

  let html = '';
  weeks.forEach(wk=>{
    const wkDrills = DRILLS.filter(d=>d.week===wk);
    const wkDone = wkDrills.filter(d=>prog[d.id]).length;
    const wkPct = Math.round(wkDone/wkDrills.length*100);
    const wkThemes = {1:'Change Direction',2:'Basic Body Feint',3:'Mix & Combination'};
    const wkSub = {1:'Drills 1–15 · Build your footwork foundation',2:'Drills 16–27 · Learn to fake out defenders',3:'Drills 28–41 · Game speed mastery'};

    html += `<div class="week-sec week${wk}" id="wk${wk}">
      <div class="wk-hdr" onclick="toggleWeek(${wk})">
        <div class="wk-num">0${wk}</div>
        <div class="wk-inf"><h3>${wkThemes[wk]}</h3><p>${wkSub[wk]}</p></div>
        <div class="wk-pct">${wkPct}%</div>
        <div class="wk-chev">▼</div>
      </div>
      <div class="wk-body">`;

    // Get all days for this week
    const days = [...new Set(wkDrills.map(d=>d.day))].sort((a,b)=>dayOrder.indexOf(a)-dayOrder.indexOf(b));
    const sched = SCHEDULE[wk];

    dayOrder.forEach(day=>{
      const drillsForDay = wkDrills.filter(d=>d.day===day);
      const schedDay = sched[day];

      if(drillsForDay.length > 0){
        const theme = drillsForDay[0].theme;
        html += `<div class="day-sep">
          <div class="day-lbl"><span class="dl-day">${day}</span><span class="dl-theme">${theme}</span></div>`;
        drillsForDay.forEach(d=>{
          const isDone = !!prog[d.id];
          html += `<div class="dr${isDone?' done':''}" id="dr-row-${d.id}" onclick="handleDrillClick(event,${d.id})">
            <div class="dr-cb"><div class="dr-cb-inner"></div></div>
            <div class="dr-mid">
              <div class="dr-title"><span class="dr-badge">#${d.id}</span>${d.name}</div>
              <div class="dr-sub">${d.desc.substring(0,70)}…</div>
            </div>
            <div class="show-move-btn" onclick="openModal(event,${d.id})">⚽<span class="tooltip">See the move</span></div>
            ${DRILL_VIDEOS[d.id]?`<a class="dr-video-btn" href="${DRILL_VIDEOS[d.id]}" target="_blank" onclick="event.stopPropagation()">&#9654;<span class="tooltip">Watch video</span></a>`:''}
          </div>`;
        });
        html += `</div>`;
      } else if(schedDay){
        html += `<div class="day-sep">
          <div class="day-lbl"><span class="dl-day">${day}</span><span class="dl-theme">${schedDay.recovery?'Recovery Day':'Rest Day'}</span></div>`;
        if(schedDay.recovery){
          html += `<div class="rec-row"><strong>🧘 Recovery — 10 to 30 Minutes</strong><p>${schedDay.recovery}</p></div>`;
        } else {
          html += `<div class="rest-row">😴 Complete rest — your muscles grow while you sleep</div>`;
        }
        html += `</div>`;
      }
    });

    // Sunday rest
    if(!days.includes('Sunday')){
      html += `<div class="day-sep">
        <div class="day-lbl"><span class="dl-day">Sunday</span><span class="dl-theme">Rest Day</span></div>
        <div class="rest-row">😴 Complete rest — see you next week!</div></div>`;
    }

    // Week complete banner
    if(wkPct===100){
      const banners={1:'🏅 Week 1 Complete — Direction Master!',2:'🔮 Week 2 Complete — Feint Apprentice!',3:'🏆 Program Complete — Body Feint Master!'};
      html += `<div style="background:linear-gradient(90deg,#FFD700,#FF8C00);color:#1a1a1a;text-align:center;padding:12px;font-weight:900;font-size:.95em">${banners[wk]}</div>`;
    }
    html += `</div></div>`;
  });

  document.getElementById('drill-list').innerHTML = html;
  renderDailyModules();

  // Restore open state
  [1,2,3].forEach(wk=>{
    const el = document.getElementById('wk'+wk);
    // Auto-open current or first incomplete week
    const wkDrills = DRILLS.filter(d=>d.week===wk);
    const incomplete = wkDrills.some(d=>!prog[d.id]);
    if(incomplete || wk===1){ el.classList.add('open'); return; }
  });
}

const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbzUBp8n0wVkPrmX6sSN8t1rmFa1Bx7dvqpd0omTTPyyMg-b9Qr__phj0VKmrnJGtTa2zg/exec';

var _syncQueue = [];

function sheetsPost(payload){
  if(!SHEETS_URL||SHEETS_URL.indexOf('YOUR_')===0)return;
  try{
    fetch(SHEETS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify(payload)
    }).catch(function(){_syncQueue.push(payload);});
  }catch(e){_syncQueue.push(payload);}
}

function sheetsLoad(playerName,onDone){
  if(!SHEETS_URL||SHEETS_URL.indexOf('YOUR_')===0){if(onDone)onDone();return;}
  var cbName='_sc'+Date.now();
  var script=document.createElement('script');
  var done=false;
  var timer=setTimeout(function(){
    if(!done){done=true;if(onDone)onDone();}
  },6000);
  window[cbName]=function(resp){
    if(done)return;done=true;clearTimeout(timer);
    try{document.head.removeChild(script);}catch(e){}
    delete window[cbName];
    if(resp&&resp.ok&&resp.data)mergeFromSheets(playerName,resp.data);
    flushSyncQueue();
    if(onDone)onDone();
  };
  script.onerror=function(){if(!done){done=true;clearTimeout(timer);if(onDone)onDone();}};
  script.src=SHEETS_URL+'?team='+TEAM_ID+'&player='+encodeURIComponent(playerName)+'&callback='+cbName+'&_t='+Date.now();
  document.head.appendChild(script);
}

function flushSyncQueue(){
  while(_syncQueue.length)sheetsPost(_syncQueue.shift());
}
function sheetsLoadAll(onDone){
  if(!SHEETS_URL||SHEETS_URL.indexOf('YOUR_')===0){if(onDone)onDone();return;}
  var cbName='_scAll'+Date.now();
  var script=document.createElement('script');
  var done=false;
  var timer=setTimeout(function(){
    if(!done){done=true;if(onDone)onDone();}
  },12000);
  window[cbName]=function(resp){
    if(done)return;done=true;clearTimeout(timer);
    try{document.head.removeChild(script);}catch(e){}
    delete window[cbName];
    if(resp&&resp.ok&&resp.data){
      Object.keys(resp.data).forEach(function(pName){
        mergeFromSheets(pName,resp.data[pName]);
      });
    }
    if(onDone)onDone();
  };
  script.onerror=function(){if(!done){done=true;clearTimeout(timer);if(onDone)onDone();}};
  script.src=SHEETS_URL+'?team='+TEAM_ID+'&all=1&callback='+cbName+'&_t='+Date.now();
  document.head.appendChild(script);
}



function normDate(raw){
  if(!raw)return'';
  // Already YYYY-MM-DD
  if(/^\d{4}-\d{2}-\d{2}$/.test(raw))return raw;
  // Google Sheets long format: "Mon Jun 01 2026 00:00:00 GMT-0400 ..."
  try{
    var d=new Date(raw);
    if(!isNaN(d.getTime())){
      var y=d.getFullYear();
      var m=String(d.getMonth()+1).padStart(2,'0');
      var day=String(d.getDate()).padStart(2,'0');
      return y+'-'+m+'-'+day;
    }
  }catch(e){}
  return raw;
}

function mergeFromSheets(n,d){
  // ── SHEETS IS THE SINGLE SOURCE OF TRUTH ──
  // Every field from Sheets overwrites localStorage.
  // Only exception: today's in-progress checkmarks are preserved if
  // Sheets hasn't received the latest write yet.

  // DAILY — normalize date keys (handles both YYYY-MM-DD and long Sheets date format)
  if(d.daily&&Object.keys(d.daily).length>0){
    var h=getDailyHistory(n);
    for(var rawDate in d.daily){
      var date=normDate(rawDate);
      if(!date)continue;
      var sd=d.daily[rawDate],ld=h[date]||{bs:[],st:[]};
      h[date]={
        bs:Array.from(new Set((ld.bs||[]).concat(sd.bs||[]))),
        st:Array.from(new Set((ld.st||[]).concat(sd.st||[])))
      };
    }
    localStorage.setItem(getDailyKey(n),JSON.stringify(h));
  }

  // JUGGLING — normalize dates and use Sheets as authoritative
  if(d.juggling&&d.juggling.log&&d.juggling.log.length>0){
    var jugLog=d.juggling.log.map(function(e){
      return{date:normDate(e.date),count:e.count};
    }).filter(function(e){return e.date;});
    var jugPR=jugLog.reduce(function(mx,e){return Math.max(mx,e.count);},0);
    saveJugData(n,{pr:jugPR,log:jugLog});
  }

  // CDE JOURNAL — normalize dates, re-attach local photos
  if(d.cde&&d.cde.length>0){
    var localCDE=getCDEJournal(n);
    var merged=d.cde.map(function(se){
      var local=localCDE.find(function(l){return String(l.id)===String(se.id);});
      return{id:se.id,date:normDate(se.date)||se.date,text:se.text,photo:local?local.photo:null};
    });
    // Keep any local entries not yet synced to Sheets (written today)
    localCDE.forEach(function(le){
      if(!merged.find(function(m){return String(m.id)===String(le.id);})){
        merged.unshift(le);
      }
    });
    merged.sort(function(a,b){return Number(b.id)-Number(a.id);});
    saveCDEJournal(n,merged);
  }

  // PROFILE — Sheets wins for any field it has
  if(d.profile){
    var lp=getProfile(n);
    if(d.profile.nickname)lp.nickname=d.profile.nickname;
    if(d.profile.number)lp.number=d.profile.number;
    if(d.profile.color)lp.color=d.profile.color;
    saveProfile(n,lp);
  }

  // PLANS — Sheets wins
  if(d.plans){
    localStorage.setItem(getPlanKey(n),JSON.stringify(d.plans));
  }
}

function initSheetsRetry(){

  sheetsPost=function(payload){
    if(!SHEETS_URL||SHEETS_URL.indexOf('YOUR_')===0)return;
    setSyncStatus('Saving…','#FFD700');
    function attempt(n){
      try{fetch(SHEETS_URL,{method:'POST',mode:'no-cors',
        headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)
      }).then(function(){
        setSyncStatus('Saved ✓','#22C55E');
        setTimeout(function(){setSyncStatus('');},2000);
      }).catch(function(){
        if(n>0){setTimeout(function(){attempt(n-1);},3000);}
        else{_syncQueue.push(payload);setSyncStatus('Queued','rgba(255,140,0,.8)');}
      });}catch(e){_syncQueue.push(payload);}
    }
    attempt(2);
  };
}

function getActiveDays(n){
  var today=pacificTodayStr();
  var h=getDailyHistory(n);
  var jd=getJugData(n);
  var cde=getCDEJournal(n);
  var activeDates=new Set();
  Object.keys(h).forEach(function(date){
    var d=h[date];
    if(d&&(d.bs.length>0||d.st.length>0)&&date<=today)activeDates.add(date);
  });
  jd.log.forEach(function(e){if(e.date<=today)activeDates.add(e.date);});
  cde.forEach(function(e){if(e.date&&e.date<=today)activeDates.add(e.date);});
  return activeDates.size;
}
function getSummerStats(){
  var today=pacificTodayStr();
  var startDate=new Date(PROGRAM_START+'T12:00:00');
  var todayDate=new Date(today+'T12:00:00');
  var endDate=new Date(PROGRAM_END+'T12:00:00');
  var elapsed=Math.max(0,Math.round((todayDate-startDate)/86400000)+1);
  var remaining=Math.max(0,Math.round((endDate-todayDate)/86400000));
  var total=Math.round((endDate-startDate)/86400000)+1;
  return{elapsed:elapsed,remaining:remaining,total:total,
         weeksLeft:Math.floor(remaining/7),daysLeft:remaining%7};
}
function renderConsistencyBar(playerName){
  var el=document.getElementById('overall-bar-container');
  if(!el)return;
  var stats=getSummerStats();
  var active=getActiveDays(playerName);
  var elapsed=stats.elapsed,remaining=stats.remaining,total=stats.total;
  var pct=elapsed>0?Math.round(active/elapsed*100):0;
  var pctCls=pct>=80?'great':pct>=50?'ok':'';
  var wl=stats.weeksLeft,dl=stats.daysLeft;
  var cdText=remaining===0?'Last day of summer!'
    :wl>0?(wl+' wk'+(wl!==1?'s':'')+(dl>0?' '+dl+'d':'')+' left')
    :(remaining+' day'+(remaining!==1?'s':'')+' left');
  var activePct=total>0?active/total*100:0;
  var inactivePct=total>0?Math.max(0,(elapsed-active)/total*100):0;
  el.innerHTML='<div class="sc-header">'
    +'<span class="sc-title">Summer Consistency <i class="tip-icon" data-tip="consistency">ℹ</i></span>'
    +'<span class="sc-countdown"><span>'+cdText+'</span></span>'
    +'</div>'
    +'<div class="sc-bar-wrap">'
      +'<div class="sc-seg-active" style="width:'+activePct.toFixed(1)+'%"></div>'
      +'<div class="sc-seg-inactive" style="width:'+inactivePct.toFixed(1)+'%"></div>'
      +'<div class="sc-seg-future"></div>'
    +'</div>'
    +'<div class="sc-stats">'
      +'<span class="sc-stat-main"><span>'+active+'</span> active days of '+elapsed+' so far</span>'
      +'<span class="sc-stat-pct '+pctCls+'">'+pct+'% consistent</span>'
    +'</div>';
}

var _hofWeekIdx=null;
function getCurrentWeekIdx(){var today=pacificTodayStr();for(var i=WEEKS.length-1;i>=0;i--){if(today>=WEEKS[i].start)return i;}return 0;}
function getWeekDays(ws,we){var days=[];var d=new Date(ws+'T12:00:00');var end=new Date(we+'T12:00:00');while(d<=end){days.push(d.toISOString().split('T')[0]);d.setDate(d.getDate()+1);}return days;}

function getWeekStats(playerName, ws, we){
  var days=getWeekDays(ws,we);
  var completeDays=0,maxStreak=0,curStreak=0;
  days.forEach(function(ds){
    if(isDayComplete(playerName,ds)){completeDays++;curStreak++;if(curStreak>maxStreak)maxStreak=curStreak;}
    else{curStreak=0;}
  });
  var jd=getJugData(playerName);
  var weekJugs=jd.log.filter(function(e){return e.date>=ws&&e.date<=we;})
    .sort(function(a,b){return a.date.localeCompare(b.date);});
  var weekPR=weekJugs.length>0?Math.max.apply(null,weekJugs.map(function(e){return e.count;})):0;
  var improvement=weekJugs.length>=3?weekPR-weekJugs[0].count:null;
  var custColor=getPlayerColor(playerName);
  var pObj=PLAYERS.find(function(p){return p.name===playerName;})||{color:'#555'};
  return{
    name:playerName,nick:getDisplayName(playerName),
    avColor:custColor||pObj.color,jersey:getJerseyNum(playerName),
    completeDays:completeDays,weekStreak:maxStreak,
    summerStreak:getStreak(playerName),
    totalSummerDays:getTotalActiveDays(playerName),
    weekPR:weekPR,improvement:improvement,jugSessions:weekJugs.length
  };
}

function getHallOfFame(weekIdx){
  var wk=WEEKS[weekIdx];if(!wk)return null;
  var stats=PLAYERS.map(function(p){return getWeekStats(p.name,wk.start,wk.end);});

  function tiebreak(a,b){
    if(b.weekStreak!==a.weekStreak)return b.weekStreak-a.weekStreak;
    if(b.summerStreak!==a.summerStreak)return b.summerStreak-a.summerStreak;
    if(b.totalSummerDays!==a.totalSummerDays)return b.totalSummerDays-a.totalSummerDays;
    return b.weekPR-a.weekPR;
  }
  var byStreak=stats.slice().sort(function(a,b){
    if(b.weekStreak!==a.weekStreak)return b.weekStreak-a.weekStreak;
    return tiebreak(a,b);
  }).filter(function(p){return p.weekStreak>0;}).slice(0,7);

  var byJuggling=stats.slice().sort(function(a,b){
    if(b.weekPR!==a.weekPR)return b.weekPR-a.weekPR;
    return tiebreak(a,b);
  }).filter(function(p){return p.weekPR>0;}).slice(0,7);

  var byImproved=stats.slice().sort(function(a,b){
    if(b.improvement!==a.improvement)return(b.improvement||0)-(a.improvement||0);
    return b.weekPR-a.weekPR;
  }).filter(function(p){return p.jugSessions>=3&&p.improvement!==null&&p.improvement>=0;}).slice(0,7);

  return{week:wk,byStreak:byStreak,byJuggling:byJuggling,byImproved:byImproved};
}

function closeTip(){
  var ov=document.getElementById('tip-overlay');

// ── TIP EVENT DELEGATION (no inline onclick needed) ──────────────
document.addEventListener('click', function(e) {
  var icon = e.target.closest('.tip-icon');
  if (icon) {
    e.stopPropagation();
    var key = icon.getAttribute('data-tip');
    if (key) showTip(key);
    return;
  }
  // Click outside tip card closes it
  if (e.target.id === 'tip-overlay') closeTip();
});
  if(ov)ov.style.display='none';
}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeTip();});

loadState();initSheetsRetry();
renderSelector();
if(state.current){
  showApp();
  sheetsLoad(state.current, function(){renderDailyModules();updateHeader();renderSelector();});
}
</script>

<!-- ── INFO POPUP OVERLAY ── -->
<div id="tip-overlay" onclick="if(event.target===this)closeTip()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;align-items:center;justify-content:center;padding:20px">
  <div id="tip-card" style="background:#111827;border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:22px 24px;max-width:360px;width:100%;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.8)">
    <button onclick="closeTip()" style="position:absolute;top:12px;right:12px;background:rgba(255,255,255,.1);border:none;border-radius:8px;color:rgba(255,255,255,.7);width:28px;height:28px;cursor:pointer;font-size:1em">✕</button>
    <div id="tip-card-icon" style="font-size:1.8em;margin-bottom:8px"></div>
    <div id="tip-card-title" style="font-weight:900;font-size:1em;color:#fff;margin-bottom:10px;padding-right:28px;line-height:1.3"></div>
    <div id="tip-card-body" style="font-size:.85em;color:rgba(255,255,255,.78);line-height:1.65"></div>
  </div>
</div>
</body>
