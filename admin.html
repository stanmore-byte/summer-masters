<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Azzurri Admin — Player Plans</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#060B14;color:#fff;min-height:100vh}
header{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.09);display:flex;align-items:center;gap:12px}
header img{height:32px;opacity:.85}
header h1{font-size:1em;font-weight:800;color:#0EA5E9}
header span{font-size:.75em;color:rgba(255,255,255,.35);margin-left:4px}
.container{max-width:820px;margin:0 auto;padding:20px 16px 60px}
.team-hdr{font-size:.7em;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:#0EA5E9;padding:18px 0 8px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:12px}
.player-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.player-hdr{display:flex;align-items:center;gap:10px;margin-bottom:12px;cursor:pointer;user-select:none}
.player-av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.95em;flex-shrink:0}
.player-name{font-weight:800;font-size:.95em;flex:1}
.player-team{font-size:.68em;color:rgba(255,255,255,.3);font-weight:600}
.player-toggle{font-size:.75em;color:rgba(255,255,255,.3)}
.plan-body{display:none;border-top:1px solid rgba(255,255,255,.07);padding-top:12px}
.plan-body.open{display:block}
.plan-section{margin-bottom:14px}
.plan-section-title{font-size:.72em;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.35);margin-bottom:8px}
.activity-row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.act-id{font-size:.65em;color:rgba(255,255,255,.25);width:32px;flex-shrink:0;font-family:monospace}
.act-name-inp{flex:1;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:6px;color:#fff;font-size:.83em;padding:5px 8px;outline:none}
.act-name-inp:focus{border-color:#0EA5E9}
.act-target-inp{width:110px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:6px;color:#fff;font-size:.83em;padding:5px 8px;outline:none}
.act-target-inp:focus{border-color:#0EA5E9}
.act-del-btn{background:none;border:none;color:rgba(255,80,80,.4);font-size:1em;cursor:pointer;padding:0 4px;flex-shrink:0}
.act-del-btn:hover{color:rgba(255,80,80,.9)}
.add-act-btn{background:rgba(14,165,233,.1);border:1px solid rgba(14,165,233,.25);color:#0EA5E9;font-size:.75em;font-weight:700;padding:5px 12px;border-radius:7px;cursor:pointer;margin-top:4px}
.add-act-btn:hover{background:rgba(14,165,233,.2)}
.plan-actions{display:flex;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.06)}
.save-btn{background:rgba(14,165,233,.15);border:1px solid rgba(14,165,233,.4);color:#0EA5E9;font-weight:800;font-size:.78em;padding:7px 16px;border-radius:8px;cursor:pointer}
.save-btn:hover{background:rgba(14,165,233,.28)}
.reset-btn{background:rgba(255,80,80,.1);border:1px solid rgba(255,80,80,.25);color:rgba(255,100,100,.8);font-weight:700;font-size:.78em;padding:7px 14px;border-radius:8px;cursor:pointer}
.reset-btn:hover{background:rgba(255,80,80,.2)}
.saved-note{font-size:.72em;color:#22C55E;margin-left:8px;opacity:0;transition:opacity .3s}
.saved-note.show{opacity:1}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#22C55E;color:#fff;padding:8px 18px;border-radius:18px;font-weight:700;font-size:.85em;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
</style>
</head>

  <h1>Player Activity Plans <span>— admin only</span></h1>
</header>
<div class="container" id="container">
  <p style="font-size:.82em;color:rgba(255,255,255,.35);padding:10px 0 16px">
    Edit each player's Ball Skills and Strength Training checklist. Changes take effect immediately — historical data is preserved. Avoid changing Activity IDs if the player has already logged data against them.
  </p>
</div>
<div id="toast"></div>
<script>
const STORM_KEY = "azzurri_storm_v2";
const U13_KEY   = "azzurri_u13_v1";

const BALL_SKILLS = [
  {id:'bs1', name:'Wall-offs — Right Foot', target:'× 100'},
  {id:'bs2', name:'Wall-offs — Left Foot',  target:'× 100'},
  {id:'bs3', name:'Toe Touches',                target:'× 30'},
  {id:'bs4', name:'Tic Tocs',                   target:'× 30'},
  {id:'bs5', name:'Iniestas — Left',        target:'× 15'},
  {id:'bs6', name:'Iniestas — Right',       target:'× 15'},
];
const STRENGTH = [
  {id:'st1', name:'Push-ups',       target:'3 × 10'},
  {id:'st2', name:'Jump Squats',    target:'3 × 10'},
  {id:'st3', name:'Lunges',         target:'3 × 10'},
  {id:'st4', name:'Plank',          target:'3 × 1 min'},
  {id:'st5', name:'Sit-ups',        target:'3 × 25'},
  {id:'st6', name:'Speedskaters',   target:'3 × 10 each foot'},
];

const STORM_PLAYERS = [
  {name:'Louise',  color:'#E74C3C'},
  {name:'Mia',     color:'#E67E22'},
  {name:'Audrey',  color:'#F1C40F'},
  {name:'Charlotte',color:'#27AE60'},
  {name:'Avi',     color:'#1ABC9C'},
  {name:'Annika',  color:'#3498DB'},
  {name:'Mikayla', color:'#9B59B6'},
  {name:'Aria',    color:'#EC407A'},
  {name:'Aubree',  color:'#FF7043'},
  {name:'Gracie',  color:'#26C6DA'},
  {name:'Amelia',  color:'#66BB6A'},
  {name:'Shailynn',color:'#7E57C2'},
  {name:'Ellie',   color:'#EF5350'},
];

function getPlanKey(storeKey, name){return storeKey+'_plan_'+name.replace(/\s+/g,'_');}
function getProfile(storeKey, name){
  try{return JSON.parse(localStorage.getItem(storeKey+'_prof_'+name.replace(/\s+/g,'_'))||'{}');}
  catch(e){return{};}
}
function getJerseyNum(storeKey, name){return getProfile(storeKey,name).number||'';}

function loadPlan(storeKey, name){
  try{
    var p=JSON.parse(localStorage.getItem(getPlanKey(storeKey,name))||'null');
    if(p&&p.bs&&p.st)return p;
  }catch(e){}
  return {bs:JSON.parse(JSON.stringify(BALL_SKILLS)),st:JSON.parse(JSON.stringify(STRENGTH))};
}
function savePlan(storeKey, name, plan){
  localStorage.setItem(getPlanKey(storeKey,name),JSON.stringify(plan));
}

function showToast(msg){
  var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2200);
}

function renderPlayerCard(storeKey, teamLabel, p){
  var jersey=getJerseyNum(storeKey,p.name);
  var displayName=jersey?'#'+jersey+' '+p.name:p.name;
  var card=document.createElement('div');
  card.className='player-card';
  card.id='card-'+storeKey+'-'+p.name.replace(/\s+/g,'-');
  
  var plan=loadPlan(storeKey,p.name);
  
  function buildRows(items, type){
    return items.map(function(item,i){
      return '<div class="activity-row" id="row-'+storeKey+'-'+p.name.replace(/\\s+/g,'-')+'-'+type+'-'+i+'">'+
        '<span class="act-id">'+item.id+'</span>'+
        '<input class="act-name-inp" type="text" value="'+item.name.replace(/"/g,'&quot;')+'" placeholder="Activity name" data-store="'+storeKey+'" data-player="'+p.name+'" data-type="'+type+'" data-idx="'+i+'" />'+
        '<input class="act-target-inp" type="text" value="'+item.target.replace(/"/g,'&quot;')+'" placeholder="e.g. × 100" data-store="'+storeKey+'" data-player="'+p.name+'" data-type="'+type+'" data-idx="'+i+'" />'+
        '<button class="act-del-btn" onclick="removeActivity(\"'+storeKey+'\",\"'+p.name+'\",\"'+type+'\",'+i+')">✕</button></div>';
    }).join('');
  }
  
  card.innerHTML='<div class="player-hdr" onclick="togglePlan(this)">'+
    '<div class="player-av" style="background:'+p.color+'">'+p.name.charAt(0)+'</div>'+
    '<div><div class="player-name">'+displayName+'</div><div class="player-team">'+teamLabel+'</div></div>'+
    '<span class="player-toggle">▼</span></div>'+
    '<div class="plan-body" id="plan-'+storeKey+'-'+p.name.replace(/\\s+/g,'-')+'">'+
    '<div class="plan-section">'+
    '<div class="plan-section-title">⚽ Ball Skills</div>'+
    '<div class="act-rows-bs" id="bs-'+storeKey+'-'+p.name.replace(/\\s+/g,'-')+'\">'+ buildRows(plan.bs,'bs')+'</div>'+
    '<button class="add-act-btn" onclick="addActivity(\"'+storeKey+'\",\"'+p.name+'\",\"bs\")">+ Add Ball Skill</button></div>'+
    '<div class="plan-section">'+
    '<div class="plan-section-title">💪 Strength Training</div>'+
    '<div class="act-rows-st" id="st-'+storeKey+'-'+p.name.replace(/\\s+/g,'-')+'\">'+ buildRows(plan.st,'st')+'</div>'+
    '<button class="add-act-btn" onclick="addActivity(\"'+storeKey+'\",\"'+p.name+'\",\"st\")">+ Add Strength Activity</button></div>'+
    '<div class="plan-actions">'+
    '<button class="save-btn" onclick="savePlanFromUI(\"'+storeKey+'\",\"'+p.name+'\")">Save Plan</button>'+
    '<button class="reset-btn" onclick="resetPlan(\"'+storeKey+'\",\"'+p.name+'\")">Reset to Default</button>'+
    '<span class="saved-note" id="note-'+storeKey+'-'+p.name.replace(/\\s+/g,'-')+'">Saved ✓</span></div></div>';
  return card;
}

function togglePlan(hdr){
  var body=hdr.nextElementSibling;
  var toggle=hdr.querySelector('.player-toggle');
  body.classList.toggle('open');
  toggle.textContent=body.classList.contains('open')?'▲':'▼';
}

function getPlanFromUI(storeKey, name){
  var safeName=name.replace(/\s+/g,'-');
  var bsContainer=document.getElementById('bs-'+storeKey+'-'+safeName);
  var stContainer=document.getElementById('st-'+storeKey+'-'+safeName);
  function extractItems(container,type){
    var items=[];
    container.querySelectorAll('.activity-row').forEach(function(row){
      var idEl=row.querySelector('.act-id');
      var nameInp=row.querySelectorAll('input')[0];
      var targetInp=row.querySelectorAll('input')[1];
      if(nameInp&&nameInp.value.trim()){
        items.push({id:idEl?idEl.textContent.trim():(type+(items.length+1)),name:nameInp.value.trim(),target:targetInp?targetInp.value.trim():''});
      }
    });
    return items;
  }
  return{bs:extractItems(bsContainer,'bs'),st:extractItems(stContainer,'st')};
}

function savePlanFromUI(storeKey,name){
  var plan=getPlanFromUI(storeKey,name);
  savePlan(storeKey,name,plan);
  var safeName=name.replace(/\s+/g,'-');
  var note=document.getElementById('note-'+storeKey+'-'+safeName);
  if(note){note.classList.add('show');setTimeout(function(){note.classList.remove('show');},2000);}
  showToast(name+"'s plan saved!");
}

function resetPlan(storeKey,name){
  if(!confirm('Reset '+name+"'s plan to defaults? Historical data is NOT affected."))return;
  localStorage.removeItem(storeKey+'_plan_'+name.replace(/\s+/g,'_'));
  // Re-render that card section
  showToast(name+"'s plan reset to defaults.");
  setTimeout(function(){location.reload();},600);
}

function addActivity(storeKey,name,type){
  var safeName=name.replace(/\s+/g,'-');
  var container=document.getElementById(type+'-'+storeKey+'-'+safeName);
  var idx=container.querySelectorAll('.activity-row').length;
  var newId=type+(idx+1)+'_custom';
  var row=document.createElement('div');
  row.className='activity-row';
  row.innerHTML='<span class="act-id">'+newId+'</span>'+
    '<input class="act-name-inp" type="text" placeholder="Activity name" />'+
    '<input class="act-target-inp" type="text" placeholder="e.g. × 20" />'+
    '<button class="act-del-btn" onclick="this.closest(\'.activity-row\').remove()">✕</button>';
  container.appendChild(row);
}

function removeActivity(storeKey,name,type,idx){
  var safeName=name.replace(/\s+/g,'-');
  var container=document.getElementById(type+'-'+storeKey+'-'+safeName);
  var rows=container.querySelectorAll('.activity-row');
  if(rows[idx])rows[idx].remove();
}

function init(){
  var container=document.getElementById('container');
  
  var h1=document.createElement('div');h1.className='team-hdr';h1.textContent='Azzurri U-11 Premier';
  container.appendChild(h1);
  STORM_PLAYERS.forEach(function(p){container.appendChild(renderPlayerCard(STORM_KEY,'U-11 Premier',p));});
}

init();
</script>
</body>
</html>
