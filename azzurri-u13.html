<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1b2a">
<title>⚽ Azzurri Storm U13 — Champions Do Extra</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Segoe UI',system-ui,Arial,sans-serif;background:#0d1b2a;color:#fff;min-height:100vh;min-height:-webkit-fill-available;padding-bottom:env(safe-area-inset-bottom)}
input,textarea,select,button{-webkit-appearance:none;font-family:inherit}

/* ── SCREENS ── */
.screen{display:none;min-height:100vh;flex-direction:column}
.screen.active{display:flex}
.hidden{display:none!important}

/* ── LOGIN ── */
#screen-login{background:linear-gradient(175deg,#0d1b2a 0%,#0a1520 100%);align-items:center;justify-content:center;padding:2rem 1.5rem;gap:1.5rem}
.login-hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:0.75rem}
.cde-logo{width:90px;height:90px;object-fit:contain;filter:drop-shadow(0 0 18px rgba(139,92,246,0.45))}
.login-hero h1{font-size:1.6rem;font-weight:900;letter-spacing:0.04em;color:#fff}
.login-hero .cde-tag{font-size:0.82rem;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:#8B5CF6;opacity:0.85}
.login-hero .team-tag{font-size:0.75rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.38)}

.player-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:360px}
.pc{border-radius:14px;padding:14px 10px;text-align:center;cursor:pointer;border:2px solid transparent;transition:all .2s;background:rgba(255,255,255,.06);position:relative}
.pc-fern{display:none;position:absolute;top:-10px;right:-10px;width:30px;height:30px;border-radius:50%;background:rgba(8,16,28,.97);border:2px solid rgba(200,215,225,.75);box-shadow:0 0 10px 3px rgba(190,208,222,.55);z-index:10;align-items:center;justify-content:center}
.pc.cde-done .pc-fern{display:flex}
.pc:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.1)}
.pc-av-wrap{position:relative;width:64px;height:64px;margin:0 auto 9px}
.pc-av-wrap svg{position:absolute;top:0;left:0;width:64px;height:64px;transform:rotate(-90deg)}
.pc-av-wrap svg .ring-bg{fill:none;stroke:rgba(255,255,255,.1);stroke-width:3}
.pc-av-wrap svg .ring-fill{fill:none;stroke:#3b82f6;stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.pc-av{width:52px;height:52px;border-radius:50%;position:absolute;top:6px;left:6px;display:flex;align-items:center;justify-content:center;font-size:1.1em;font-weight:900;color:#fff;transition:box-shadow .4s}
/* CDE complete state — silver glow on the card box */
.pc.cde-done{border-color:rgba(200,210,220,.75);box-shadow:0 0 10px 4px rgba(190,205,220,.55),0 0 22px 8px rgba(170,190,210,.25)}
.pc-av-wrap.cde-done svg{display:none}
.pc-cde-badge{display:none;font-size:.58em;font-weight:900;letter-spacing:.12em;color:#c8d8e8;text-shadow:0 0 6px rgba(190,210,230,.8);margin-top:1px}
.pc-av-wrap.cde-done~.pc-name-row .pc-cde-badge{display:inline}
.pc-name-row{display:flex;flex-direction:column;align-items:center;gap:1px}
.pc-name-juggle{display:flex;align-items:center;justify-content:center;gap:5px}
.pc-name{font-weight:800;font-size:.9em}
.pc-juggles{font-size:.7em;font-weight:700;color:#8B5CF6;opacity:.85}

/* ── HEADER ── */
.app-hdr{position:sticky;top:0;z-index:100;padding:10px 14px;background:rgba(10,20,32,.97);display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08)}
.ah-logo{width:28px;height:28px;object-fit:contain;opacity:0.85}
.ah-titles{flex:1;min-width:0}
.ah-name{font-weight:900;font-size:.98em;letter-spacing:.02em}
.ah-sub{font-size:.7em;color:#8B5CF6;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.btn-ghost{background:none;border:1px solid rgba(255,255,255,.22);color:rgba(255,255,255,.65);padding:5px 11px;border-radius:20px;font-size:.73em;cursor:pointer;font-weight:600}
.btn-ghost:hover{border-color:rgba(255,255,255,.5);color:#fff}

/* ── TABS ── */
.tab-bar{position:sticky;top:53px;z-index:99;display:flex;background:rgba(10,20,32,.95);border-bottom:1px solid rgba(255,255,255,.07)}
.tab-btn{flex:1;padding:11px 4px;text-align:center;font-size:.78em;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.38);cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;touch-action:manipulation;min-height:44px}
.tab-btn.active{color:#8B5CF6;border-bottom-color:#8B5CF6}

/* ── TAB PANES ── */
.tab-pane{display:none;padding:14px 14px 48px}
.tab-pane.active{display:block}

/* ── CARDS ── */
.card{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09);border-radius:14px;margin-bottom:12px;overflow:hidden}
.card-hdr{padding:11px 14px 4px;display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:.72em;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:#7fbfff}
.card-body{padding:4px 14px 12px}

/* ── ASSIGNMENT HEADER ── */
.asgn-meta{padding:12px 14px 10px}
.asgn-title{font-size:1.05em;font-weight:900;margin-bottom:3px}
.asgn-date{font-size:.76em;color:rgba(255,255,255,.4);font-weight:600}
.asgn-cde{display:inline-flex;align-items:center;gap:5px;margin-top:6px;font-size:.72em;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#8B5CF6;background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.25);border-radius:6px;padding:3px 9px}

/* ── PROGRESS ── */
.prog-wrap{display:flex;align-items:center;gap:8px;padding:8px 14px 12px}
.prog-track{flex:1;height:8px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,#8B5CF6,#7C3AED);border-radius:4px;transition:width .4s ease}
.prog-fill.done{background:linear-gradient(90deg,#27ae60,#16a34a)}
.prog-label{font-size:.78em;font-weight:800;color:rgba(255,255,255,.45);min-width:2.5rem;text-align:right}

/* ── SECTION ── */
.section-hdr{padding:9px 14px 5px;display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid rgba(255,255,255,.06)}
.section-hdr:first-child{border-top:none}
.section-name{font-size:.82em;font-weight:800;color:#fff}
.section-dur{font-size:.7em;color:rgba(255,255,255,.3);font-weight:600}

/* ── CHECKBOX ROWS ── */
.check-row{display:flex;align-items:center;gap:11px;padding:9px 14px;cursor:pointer;transition:background .12s;border-top:1px solid rgba(255,255,255,.04);touch-action:manipulation;min-height:44px}
.check-row:first-of-type{border-top:none}
.check-row:hover{background:rgba(255,255,255,.05)}
.check-row.checked{background:rgba(39,174,96,.07)}
.cb-box{width:23px;height:23px;border:2px solid rgba(255,255,255,.22);border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s}
.check-row.checked .cb-box{background:#27ae60;border-color:#27ae60}
.cb-tick{display:none;width:5px;height:9px;border:2.5px solid #fff;border-top:none;border-left:none;transform:rotate(45deg) translateY(-1px)}
.check-row.checked .cb-tick{display:block}
.cb-label{font-size:.9em;font-weight:600;flex:1}
.check-row.checked .cb-label{opacity:.42;text-decoration:line-through}

/* single-row section (no sub-items) */
.check-row.section-row .cb-label{font-weight:800;font-size:.88em}

/* ── FILM REVIEW ── */
.film-prompt{font-size:.78em;color:rgba(255,255,255,.4);line-height:1.6;padding:6px 14px 6px}
.film-ta{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:10px;color:#fff;font-size:16px;font-family:inherit;padding:10px 12px;resize:vertical;min-height:110px;outline:none;margin:0 14px 12px;width:calc(100% - 28px)}
.film-ta:focus{border-color:rgba(139,92,246,.45)}
.film-ta::placeholder{color:rgba(255,255,255,.2)}

/* ── COMPLETE BANNER ── */
.done-banner{display:flex;align-items:center;gap:10px;padding:11px 14px;background:rgba(39,174,96,.12);border:1px solid rgba(39,174,96,.3);border-radius:12px;margin-bottom:12px}
.done-banner span{font-size:1.3em}
.done-banner p{font-size:.85em;font-weight:700;color:#4ade80}

/* ── NO ASSIGNMENT ── */
.empty{text-align:center;padding:3rem 1rem;color:rgba(255,255,255,.35)}
.empty .icon{font-size:2.4rem;margin-bottom:.75rem}
.empty p{font-size:.9rem;line-height:1.7}
.empty strong{color:#8B5CF6}

/* ── JUGGLING ── */
.jug-circle-wrap{text-align:center;padding:1rem 0 0.5rem}
.jug-input{width:130px;height:130px;border-radius:50%;background:rgba(139,92,246,.08);border:3px solid rgba(139,92,246,.3);color:#8B5CF6;font-size:3rem;font-weight:900;text-align:center;-moz-appearance:textfield;outline:none;display:block;margin:0 auto;touch-action:manipulation}
.jug-input:focus{border-color:#8B5CF6;background:rgba(139,92,246,.13)}
.jug-input::-webkit-inner-spin-button,.jug-input::-webkit-outer-spin-button{-webkit-appearance:none}
.jug-meta{font-size:.78em;color:rgba(255,255,255,.38);text-align:center;margin-top:.5rem}
.jug-btn{width:100%;background:rgba(139,92,246,.16);border:1px solid rgba(139,92,246,.4);color:#8B5CF6;font-weight:800;font-size:.9em;padding:10px;border-radius:10px;cursor:pointer;margin-top:1rem;transition:background .15s;letter-spacing:.04em}
.jug-btn:hover{background:rgba(139,92,246,.28)}
.jug-btn:disabled{opacity:.4;cursor:not-allowed}
.jug-hist-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.jug-hist-row:last-child{border-bottom:none}
.jug-hist-date{font-size:.82em;color:rgba(255,255,255,.4)}
.jug-hist-count{font-size:1em;font-weight:900;color:#8B5CF6}
.best-tag{font-size:.65em;background:rgba(139,92,246,.15);color:#8B5CF6;padding:1px 6px;border-radius:4px;margin-left:5px;font-weight:700}

/* ── HISTORY ── */
.hist-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.hist-row:last-child{border-bottom:none}
.hist-dot{width:32px;height:32px;min-width:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.9em}
.hist-dot.full{background:rgba(39,174,96,.2);color:#27ae60}
.hist-dot.partial{background:rgba(139,92,246,.12);color:#8B5CF6}
.hist-date{font-size:.88em;font-weight:700}
.hist-detail{font-size:.74em;color:rgba(255,255,255,.38)}

/* ── LOADING ── */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.75rem;padding:3rem 1rem;color:rgba(255,255,255,.3);font-size:.85em}
.spinner{width:26px;height:26px;border:3px solid rgba(255,255,255,.12);border-top-color:#8B5CF6;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── TOAST ── */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(3rem);background:rgba(10,20,32,.95);border:1px solid rgba(139,92,246,.3);color:#fff;padding:9px 20px;border-radius:20px;font-weight:700;font-size:.85em;z-index:300;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- ════════ LOGIN ════════ -->
<div id="screen-login" class="screen">
  <div class="login-hero">
    <img class="cde-logo" src="CDE Silver Fern Logo.png" alt="Champions Do Extra" onerror="this.style.display='none'">
    <h1>AZZURRI STORM</h1>
    <div class="cde-tag">Champions Do Extra</div>
    <div class="team-tag">U13 Premier · Fall 2026</div>
  </div>

  <div class="player-grid" id="player-grid"></div>
</div>

<!-- ════════ MAIN APP ════════ -->
<div id="screen-main" class="screen hidden" style="display:none">

  <div class="app-hdr">
    <button class="btn-ghost" onclick="viewTeam()" style="border-color:rgba(139,92,246,.5);color:#8B5CF6;font-size:.68em;letter-spacing:.04em;flex-shrink:0">👥 TEAM</button>
    <div class="ah-titles" style="text-align:center;flex:1">
      <div class="ah-name" id="ah-player-name">—</div>
      <div class="ah-sub">Champions Do Extra</div>
    </div>
    <button class="btn-ghost" onclick="logout()" style="flex-shrink:0">Switch ✕</button>
  </div>

  <div class="tab-bar">
    <div class="tab-btn active" data-tab="today" onclick="switchTab('today')">Today</div>
    <div class="tab-btn" data-tab="juggling" onclick="switchTab('juggling')">Juggling</div>
    <div class="tab-btn" data-tab="history" onclick="switchTab('history')">History</div>
  </div>

  <!-- TODAY -->
  <div id="tab-today" class="tab-pane active">
    <div class="loading" id="today-loading"><div class="spinner"></div><span>Loading…</span></div>
    <div id="today-content"></div>
  </div>

  <!-- JUGGLING -->
  <div id="tab-juggling" class="tab-pane">
    <div class="card">
      <div class="card-hdr"><span class="card-title">🏆 Today's Juggling</span></div>
      <div class="card-body">
        <div class="jug-circle-wrap">
          <input type="number" id="jug-input" class="jug-input" min="0" max="9999" placeholder="0">
          <div class="jug-meta" id="jug-meta">Enter your best count for tonight</div>
        </div>
        <button class="jug-btn" id="jug-btn" onclick="logJuggle()">Log it ✓</button>
      </div>
    </div>
    <div class="card">
      <div class="card-hdr"><span class="card-title">Recent Sessions</span></div>
      <div class="card-body" id="jug-hist">
        <div class="loading"><div class="spinner"></div></div>
      </div>
    </div>
  </div>

  <!-- HISTORY -->
  <div id="tab-history" class="tab-pane">
    <div class="card">
      <div class="card-hdr"><span class="card-title">Training Log</span></div>
      <div class="card-body" id="hist-body">
        <div class="loading"><div class="spinner"></div></div>
      </div>
    </div>
  </div>

</div>

<div id="toast"></div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────
const SUPABASE_URL  = 'https://whcedefnnwkvuvydxgkf.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndoY2VkZWZubndrdnV2eWR4Z2tmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwNjk5NzMsImV4cCI6MjA5OTY0NTk3M30.IDnjM1pQNXIothaejZ9UNmSltaXVOlnzqBGzW-NPNvY';

let db;
try {
  const { createClient } = supabase;
  db = createClient(SUPABASE_URL, SUPABASE_ANON);
} catch(e) {
  console.warn('Supabase init failed:', e);
  db = null;
}

// ── ROSTER ───────────────────────────────────────────────────────────
const ROSTER = [
  {name:'Camryn',   jersey:'4'},
  {name:'Charlotte',jersey:'6'},
  {name:'Hannah',   jersey:'7'},
  {name:'Ellie',    jersey:'11'},
  {name:'Reese',    jersey:'16'},
  {name:'Kaia',     jersey:'17'},
  {name:'Caroline', jersey:'18'},
  {name:'Baylor',   jersey:'21'},
  {name:'Hailey',   jersey:'27'},
  {name:'Noelle',   jersey:'33'},
  {name:'London',   jersey:''},
  {name:'Mady',     jersey:''},
  {name:'Marie',    jersey:''},
  {name:'Melissa',  jersey:''},
  {name:'Myra',     jersey:''},
  {name:'Susie',    jersey:''},
];
const COLORS = ['#7C3AED','#2563EB','#DC2626','#D97706','#16A34A','#0891B2','#BE185D','#EA580C','#4F46E5',
                 '#7C3AED','#2563EB','#DC2626','#D97706','#16A34A','#0891B2','#BE185D'];

// ── STATE ────────────────────────────────────────────────────────────
let player     = localStorage.getItem('az13_player') || null;
// Normalize legacy spellings
if (player === 'Madi') { player = 'Mady'; localStorage.setItem('az13_player','Mady'); }
if (player === 'Susanna') { player = 'Susie'; localStorage.setItem('az13_player','Susie'); }
let today      = new Date().toLocaleDateString('en-CA');
let assignment = null;
let checked    = new Set();
let saveTimer  = null;

// ── BUILD PLAYER GRID ─────────────────────────────────────────────────
const grid = document.getElementById('player-grid');
const CIRC = 2 * Math.PI * 29; // circumference for r=29 (64px viewBox)

function buildGrid(progressMap, juggleMap, cdeSet) {
  grid.innerHTML = '';
  ROSTER.forEach((p, i) => {
    const col = COLORS[i % COLORS.length];
    const badge = p.jersey ? `#${p.jersey}` : p.name.slice(0,2).toUpperCase();
    const pct = progressMap[p.name] || 0;
    const juggles = juggleMap[p.name] || 0;
    const isDone = cdeSet && cdeSet.has(p.name);
    const offset = CIRC * (1 - pct);
    const div = document.createElement('div');
    div.className = `pc${isDone ? ' cde-done' : ''}`;
    div.innerHTML = `
      <div class="pc-fern"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 2 C5 2 3 5 3 8 C3 11 5 14 8 14 C11 14 13 11 13 8 C13 5 11 2 8 2 Z" fill="none" stroke="#c8d8e8" stroke-width="1.2" opacity="0"/><path d="M8 13 L8 4" stroke="#c8d8e8" stroke-width="1.4" stroke-linecap="round"/><path d="M8 5 C8 5 6 6 5 7.5" stroke="#c8d8e8" stroke-width="1.1" stroke-linecap="round"/><path d="M8 7 C8 7 6 8 5.5 9" stroke="#c8d8e8" stroke-width="1.0" stroke-linecap="round"/><path d="M8 9 C8 9 6.5 9.5 6 10.5" stroke="#c8d8e8" stroke-width="0.9" stroke-linecap="round"/><path d="M8 5 C8 5 10 6 11 7.5" stroke="#c8d8e8" stroke-width="1.1" stroke-linecap="round"/><path d="M8 7 C8 7 10 8 10.5 9" stroke="#c8d8e8" stroke-width="1.0" stroke-linecap="round"/><path d="M8 9 C8 9 9.5 9.5 10 10.5" stroke="#c8d8e8" stroke-width="0.9" stroke-linecap="round"/></svg></div>
      <div class="pc-av-wrap${isDone ? ' cde-done' : ''}">
        <svg viewBox="0 0 64 64"><circle class="ring-bg" cx="32" cy="32" r="29"/><circle class="ring-fill" cx="32" cy="32" r="29" stroke-dasharray="${CIRC}" stroke-dashoffset="${offset}"/></svg>
        <div class="pc-av" style="background:${col}">${badge}</div>
      </div>
      <div class="pc-name-row">
        <div class="pc-name-juggle">
          <div class="pc-name">${p.name}</div>
          ${juggles ? `<div class="pc-juggles">${juggles}🏅</div>` : ''}
        </div>
        ${isDone ? `<div class="pc-cde-badge">⚡ CDE</div>` : ''}
      </div>`;
    div.onclick = () => login(p.name);
    grid.appendChild(div);
  });
}

// ── INIT ─────────────────────────────────────────────────────────────
if (player) showMain();
else showLogin();

function showLogin() {
  document.getElementById('screen-login').classList.add('active');
  document.getElementById('screen-main').style.display = 'none';
  // Load team progress for today
  buildGrid({}, {}, new Set());
  (async () => {
    try {
      const todayStr = new Date().toLocaleDateString('en-CA');
      const [compRes, juggleRes, asgRes] = await Promise.all([
        db.from('homework_completions').select('player,completed_items,film_notes').eq('team','u13').eq('date',todayStr),
        db.from('juggling_logs').select('player,count').eq('team','u13').eq('date',todayStr),
        db.from('assignments').select('sections').eq('team','u13').eq('date',todayStr).maybeSingle()
      ]);
      // Total checkable items (including film review)
      const sections = asgRes.data?.sections || [];
      const totalItems = getCheckableIds(sections).length || 14;
      const progressMap = {};
      const cdeSet = new Set();
      (compRes.data || []).forEach(row => {
        const done = (row.completed_items || []).length;
        const filmDone = !!(row.film_notes?.trim());
        const fullDone = done + (filmDone ? 1 : 0);
        progressMap[row.player] = Math.min(fullDone / totalItems, 1);
        if (fullDone >= totalItems) cdeSet.add(row.player);
      });
      const juggleMap = {};
      (juggleRes.data || []).forEach(row => { juggleMap[row.player] = row.count; });
      buildGrid(progressMap, juggleMap, cdeSet);
    } catch(e) { /* leave grid as-is */ }
  })();
}

function login(name) {
  player = name;
  localStorage.setItem('az13_player', player);
  showMain();
}

function viewTeam() {
  document.getElementById('screen-main').style.display = 'none';
  showLogin();
}

function logout() {
  localStorage.removeItem('az13_player');
  player = null;
  document.getElementById('screen-main').style.display = 'none';
  document.getElementById('screen-login').classList.add('active');
}

function showMain() {
  document.getElementById('screen-login').classList.remove('active');
  const main = document.getElementById('screen-main');
  main.classList.remove('hidden');
  main.style.display = 'flex';
  document.getElementById('ah-player-name').textContent = player;
  loadToday();
  loadJuggleHist();
  loadHistory();
}

// ── TABS ──────────────────────────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.toggle('active', p.id === 'tab-' + tab));
}

// ── TODAY ─────────────────────────────────────────────────────────────
async function loadToday() {
  document.getElementById('today-loading').style.display = 'flex';
  document.getElementById('today-content').innerHTML = '';

  const [asgnRes, compRes] = await Promise.all([
    db.from('assignments').select('*').eq('team','u13').eq('date',today).single(),
    db.from('homework_completions').select('*').eq('player',player).eq('team','u13').eq('date',today).single(),
  ]);

  document.getElementById('today-loading').style.display = 'none';

  assignment = (asgnRes.error && asgnRes.error.code === 'PGRST116') ? null : asgnRes.data;
  const comp = (compRes.error && compRes.error.code === 'PGRST116') ? null : compRes.data;
  checked = new Set(comp?.completed_items || []);

  renderToday(comp);
}

function renderToday(comp) {
  const el = document.getElementById('today-content');

  if (!assignment) {
    el.innerHTML = `<div class="empty">
      <div class="icon">📋</div>
      <p>No assignment posted yet for today.<br><strong>Check back tonight</strong> — Coach Will drops homework before 6 PM.</p>
    </div>`;
    return;
  }

  const sections = assignment.sections || [];
  const allIds = getCheckableIds(sections);
  // Seed __film__ into checked if film notes already exist
  if (comp?.film_notes?.trim()) checked.add('__film__');
  else checked.delete('__film__');
  const total = allIds.length;
  const done = allIds.filter(id => checked.has(id)).length;
  const pct = total ? Math.round((done/total)*100) : 0;
  const allDone = total > 0 && done === total;

  let html = '';

  if (allDone) {
    html += `<div class="done-banner"><span>🏆</span><p>Assignment complete — <s style="opacity:.45">Champions</s> <strong style="color:#8B5CF6">${esc(player)}</strong> Did Extra!</p></div>`;
  }

  // Main assignment card
  html += `<div class="card">
    <div class="asgn-meta">
      <div class="asgn-title">${esc(assignment.title)}</div>
      <div class="asgn-date">${fmtFull(assignment.date)}</div>
      <div class="asgn-cde">⚡ Champions Do Extra</div>
    </div>
    ${total > 0 ? `<div class="prog-wrap">
      <div class="prog-track"><div class="prog-fill${allDone?' done':''}" style="width:${pct}%"></div></div>
      <div class="prog-label">${done}/${total}</div>
    </div>` : ''}`;

  sections.forEach(sec => {
    const secLabel = stripNum(sec.label);
    if (sec.has_notes) {
      // Film review — counts as __film__ checkbox
      const notes = comp?.film_notes || '';
      const filmChecked = checked.has('__film__');
      html += `<div class="section-hdr"><span class="section-name">${esc(secLabel)}</span></div>
        <p class="film-prompt">Write 3 things you did well and 3 to improve.</p>
        <textarea class="film-ta" id="film-ta" placeholder="Three things I did well:&#10;1. &#10;2. &#10;3. &#10;&#10;Three things to improve:&#10;1. &#10;2. &#10;3."
          ${notes ? 'disabled style="opacity:.45"' : ''}>${esc(notes)}</textarea>
        <div style="padding:0 14px 14px">
          <button id="film-btn" onclick="submitFilm()" style="width:100%;padding:10px;border-radius:10px;border:none;font-size:.9em;font-weight:800;letter-spacing:.06em;cursor:pointer;transition:all .2s;background:${notes?'rgba(255,255,255,.1)':'#8B5CF6'};color:${notes?'rgba(255,255,255,.55)':'#fff'}">${notes ? 'Edit' : 'Submit'}</button>
        </div>`;
    } else if (!sec.items || sec.items.length === 0) {
      // Single-checkbox section — show a section header then a Done checkbox
      const isChecked = checked.has(sec.id);
      html += `<div class="section-hdr">
        <span class="section-name">${esc(secLabel)}</span>
        ${sec.duration ? `<span class="section-dur">${esc(sec.duration)}</span>` : ''}
      </div>
      <div class="check-row section-row${isChecked?' checked':''}" onclick="toggle('${sec.id}',this)">
        <div class="cb-box"><div class="cb-tick"></div></div>
        <div class="cb-label">Done</div>
      </div>`;
    } else {
      // Section with sub-items
      html += `<div class="section-hdr">
        <span class="section-name">${esc(secLabel)}</span>
        ${sec.duration ? `<span class="section-dur">${esc(sec.duration)}</span>` : ''}
      </div>`;
      sec.items.forEach(item => {
        const isChecked = checked.has(item.id);
        html += `<div class="check-row${isChecked?' checked':''}" onclick="toggle('${item.id}',this)">
          <div class="cb-box"><div class="cb-tick"></div></div>
          <div class="cb-label">${esc(stripNum(item.label))}</div>
        </div>`;
      });
    }
  });

  html += '</div>'; // close card
  el.innerHTML = html;
}

// Strip leading numbering like "1--", "2·", "3.", "4 -" from labels
function stripNum(label) {
  return (label || '').replace(/^\d+[\s]*[-–·\.]+[\s]*/,'').trim();
}

function getCheckableIds(sections) {
  const ids = [];
  sections.forEach(s => {
    if (s.has_notes) { ids.push('__film__'); return; }
    if (!s.items || s.items.length === 0) ids.push(s.id);
    else s.items.forEach(it => ids.push(it.id));
  });
  return ids;
}

function toggle(id, row) {
  if (checked.has(id)) {
    checked.delete(id);
    row.classList.remove('checked');
  } else {
    checked.add(id);
    row.classList.add('checked');
  }
  updateProgress();
  schedSave();
}

function toggleFilm() {
  const ta = document.getElementById('film-ta');
  if (ta && ta.value.trim()) checked.add('__film__');
  else checked.delete('__film__');
  updateProgress();
}

function submitFilm() {
  const ta = document.getElementById('film-ta');
  const btn = document.getElementById('film-btn');
  if (!ta || !btn) return;
  if (ta.disabled) {
    // Switch to Edit mode
    ta.disabled = false;
    ta.style.opacity = '1';
    btn.textContent = 'Submit';
    btn.style.background = '#8B5CF6';
    btn.style.color = '#fff';
    ta.focus();
  } else {
    if (!ta.value.trim()) { showToast('Write something first!'); return; }
    ta.disabled = true;
    ta.style.opacity = '.45';
    btn.textContent = 'Edit';
    btn.style.background = 'rgba(255,255,255,.1)';
    btn.style.color = 'rgba(255,255,255,.55)';
    checked.add('__film__');
    updateProgress();
    saveComp();
  }
}

function updateProgress() {
  if (!assignment) return;
  const sections = assignment.sections || [];
  const allIds = getCheckableIds(sections);
  const total = allIds.length;
  const done = allIds.filter(id => checked.has(id)).length;
  const allDone = total > 0 && done === total;
  const pct = total ? Math.round((done/total)*100) : 0;
  const fill = document.querySelector('.prog-fill');
  if (fill) { fill.style.width = pct + '%'; fill.classList.toggle('done', allDone); }
  const lbl = document.querySelector('.prog-label');
  if (lbl) lbl.textContent = `${done}/${total}`;
  const banner = document.querySelector('.done-banner');
  if (banner) banner.style.display = allDone ? 'flex' : 'none';
}

function schedSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveComp, 900);
}

async function saveComp() {
  if (!assignment) return;
  const ta = document.getElementById('film-ta');
  const notes = ta ? ta.value : '';
  const { error } = await db.from('homework_completions').upsert({
    player, team:'u13', date:today,
    completed_items: [...checked],
    film_notes: notes,
    updated_at: new Date().toISOString(),
  }, { onConflict:'player,team,date' });
  if (!error) showToast('Saved ✓');
  else { console.error(error); showToast('Save failed'); }
}

// ── JUGGLING ──────────────────────────────────────────────────────────
async function loadJuggleHist() {
  const { data } = await db.from('juggling_logs')
    .select('date,count').eq('player',player).eq('team','u13')
    .order('date',{ascending:false}).limit(14);

  const hist = document.getElementById('jug-hist');
  if (!data || data.length === 0) {
    hist.innerHTML = '<div style="color:rgba(255,255,255,.3);font-size:.85em;padding:.5rem 0">No sessions logged yet.</div>';
    return;
  }

  const best = Math.max(...data.map(r => r.count));
  const todayRow = data.find(r => r.date === today);
  if (todayRow) {
    document.getElementById('jug-input').value = todayRow.count;
    document.getElementById('jug-meta').textContent = `${todayRow.count} logged today — beat it!`;
  }

  hist.innerHTML = data.map(r => `
    <div class="jug-hist-row">
      <span class="jug-hist-date">${fmtShort(r.date)}</span>
      <span class="jug-hist-count">${r.count}${r.count===best?'<span class="best-tag">BEST</span>':''}</span>
    </div>`).join('');
}

async function logJuggle() {
  const val = parseInt(document.getElementById('jug-input').value, 10);
  if (isNaN(val) || val < 0) { showToast('Enter a number first'); return; }
  document.getElementById('jug-btn').disabled = true;
  const { error } = await db.from('juggling_logs').upsert({
    player, team:'u13', date:today, count:val,
    updated_at: new Date().toISOString(),
  }, { onConflict:'player,team,date' });
  document.getElementById('jug-btn').disabled = false;
  if (!error) {
    showToast(`${val} juggles logged ✓`);
    document.getElementById('jug-meta').textContent = `${val} logged today — beat it!`;
    loadJuggleHist();
  } else showToast('Error — check connection');
}

// ── HISTORY ───────────────────────────────────────────────────────────
async function loadHistory() {
  const [cRes, jRes] = await Promise.all([
    db.from('homework_completions').select('date,completed_items')
      .eq('player',player).eq('team','u13').order('date',{ascending:false}).limit(30),
    db.from('juggling_logs').select('date,count')
      .eq('player',player).eq('team','u13').order('date',{ascending:false}).limit(30),
  ]);

  const cMap = {}, jMap = {};
  (cRes.data||[]).forEach(r => cMap[r.date] = r.completed_items?.length || 0);
  (jRes.data||[]).forEach(r => jMap[r.date] = r.count);

  const dates = [...new Set([...Object.keys(cMap),...Object.keys(jMap)])].sort().reverse();
  const el = document.getElementById('hist-body');

  if (!dates.length) {
    el.innerHTML = '<div style="color:rgba(255,255,255,.3);font-size:.85em;padding:.5rem 0">No logs yet — start tonight!</div>';
    return;
  }

  el.innerHTML = dates.map(d => {
    const tasks = cMap[d] || 0;
    const juggles = jMap[d];
    const parts = [];
    if (tasks) parts.push(`${tasks} task${tasks>1?'s':''}`);
    if (juggles !== undefined) parts.push(`${juggles} juggles`);
    const cls = tasks > 0 ? 'full' : 'partial';
    return `<div class="hist-row">
      <div class="hist-dot ${cls}">${tasks > 0 ? '✓' : '⚡'}</div>
      <div>
        <div class="hist-date">${fmtFull(d)}</div>
        <div class="hist-detail">${parts.join(' · ')}</div>
      </div>
    </div>`;
  }).join('');
}

// ── UTILS ─────────────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtFull(d) {
  if (!d) return '';
  return new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}

function fmtShort(d) {
  if (!d) return '';
  return new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
</script>
