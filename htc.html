<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hood to Coast 2026 — Training Plan</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--green:#22C55E;--gold:#F59E0B;--blue:#0EA5E9;--red:#EF4444}
body{font-family:'Segoe UI',system-ui,Arial,sans-serif;background:#000;color:#fff;min-height:100vh}
.screen{display:none}.screen.active{display:block}

/* ── HERO ── */
.hero{text-align:center;padding:28px 20px 10px}
.hero img{width:min(48%,200px);height:auto;display:block;margin:0 auto 14px;opacity:.9}
.hero h1{font-size:clamp(1.2rem,5vw,1.8rem);font-weight:900;background:linear-gradient(90deg,#fff,rgba(255,255,255,.6));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
.hero p{font-size:.85rem;color:rgba(255,255,255,.45);max-width:320px;margin:0 auto}
.htc-badge{display:inline-block;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);border-radius:20px;padding:4px 14px;font-size:.72em;font-weight:800;color:#EF4444;margin:10px 0;letter-spacing:.06em}

/* ── REGISTER ── */
.reg-wrap{max-width:480px;margin:0 auto;padding:16px 16px 30px}
.reg-form{display:flex;gap:8px;margin-bottom:8px}
.reg-input{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:10px;color:#fff;font-size:1em;padding:10px 14px;outline:none;font-family:inherit}
.reg-input:focus{border-color:#EF4444}
.reg-btn{background:linear-gradient(135deg,#EF4444,#DC2626);border:none;border-radius:10px;color:#fff;font-weight:800;font-size:.9em;padding:10px 18px;cursor:pointer}
.reg-or{text-align:center;font-size:.7em;color:rgba(255,255,255,.22);padding:8px 0;letter-spacing:.06em;text-transform:uppercase}
.player-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;max-width:600px;margin:0 auto;padding:0 16px 40px}
.pc{border-radius:14px;padding:14px 10px;text-align:center;cursor:pointer;border:2px solid transparent;transition:all .2s;background:rgba(255,255,255,.06)}
.pc:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.3)}
.pc-av{width:48px;height:48px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:1.1em;font-weight:900;color:#fff;background:#EF4444}
.pc-name{font-weight:800;font-size:.9em}
.pc-done{font-size:.68em;color:rgba(255,255,255,.4);margin-top:4px}

/* ── APP ── */
.app-hdr{position:sticky;top:0;z-index:100;padding:10px 14px;background:rgba(0,0,0,.97);display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08)}
.app-hdr-logo{height:26px;width:auto;opacity:.8;flex-shrink:0}
.ah-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.88em;color:#fff;background:#EF4444;flex-shrink:0}
.ah-inf{flex:1;min-width:0}
.ah-name{font-weight:800;font-size:.95em}
.ah-sub{font-size:.72em;color:rgba(255,255,255,.45)}
.btn-ghost{background:none;border:1px solid rgba(255,255,255,.22);color:rgba(255,255,255,.7);padding:5px 10px;border-radius:20px;font-size:.72em;cursor:pointer;white-space:nowrap;font-weight:600}

/* ── PROGRESS ── */
.prog-bar-wrap{background:rgba(255,255,255,.07);border-radius:12px;padding:12px 14px;margin:10px 14px 4px}
.prog-row{display:flex;justify-content:space-between;margin-bottom:6px;font-size:.78em}
.prog-row span:first-child{color:rgba(255,255,255,.5);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:.85em}
.prog-track{height:8px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,#EF4444,#F97316);border-radius:4px;transition:width .5s}

/* ── PLAN ── */
.plan-wrap{padding:10px 14px 60px}
.phase-hdr{font-size:.72em;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:#EF4444;padding:18px 0 8px;border-bottom:1px solid rgba(239,68,68,.2);margin-bottom:10px}
.week-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.week-card.special{border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.04)}
.week-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.week-title{font-weight:800;font-size:.9em}
.week-dates{font-size:.68em;color:rgba(255,255,255,.38)}
.week-target{font-size:.68em;font-weight:800;background:rgba(255,255,255,.08);border-radius:6px;padding:2px 8px;color:rgba(255,255,255,.6)}
.week-progress{height:4px;background:rgba(255,255,255,.1);border-radius:2px;margin-bottom:10px;overflow:hidden}
.week-prog-fill{height:100%;background:linear-gradient(90deg,#EF4444,#F97316);border-radius:2px;transition:width .4s}

/* ── ITEMS ── */
.train-item{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer;transition:background .12s;border-radius:6px}
.train-item:last-child{border-bottom:none}
.train-item:hover{background:rgba(255,255,255,.04)}
.train-item.done .train-desc{opacity:.4;text-decoration:line-through}
.train-cb{width:22px;height:22px;border:2px solid rgba(255,255,255,.22);border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s}
.train-item.done .train-cb{background:#22C55E;border-color:#22C55E}
.train-cb-inner{display:none;width:5px;height:9px;border:2.5px solid #fff;border-top:none;border-left:none;transform:rotate(45deg) translateY(-2px)}
.train-item.done .train-cb-inner{display:block}
.train-day{font-size:.68em;font-weight:800;color:rgba(255,255,255,.35);min-width:42px;flex-shrink:0;letter-spacing:.04em;text-transform:uppercase}
.train-item.strength .train-day{color:rgba(14,165,233,.6)}
.train-desc{font-size:.86em;font-weight:600;flex:1;line-height:1.35}

/* ── STRENGTH CARD ── */
.strength-card{background:rgba(14,165,233,.06);border:1px solid rgba(14,165,233,.2);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.strength-title{font-size:.75em;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#0EA5E9;margin-bottom:8px}
.strength-item{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:.82em;color:rgba(255,255,255,.7);border-bottom:1px solid rgba(255,255,255,.04)}
.strength-item:last-child{border-bottom:none}
.strength-bullet{color:#0EA5E9;font-size:1em;flex-shrink:0}
.strength-note{font-size:.72em;color:rgba(255,255,255,.3);margin-top:6px;text-align:center;font-style:italic}

#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#22C55E;color:#fff;padding:8px 18px;border-radius:18px;font-weight:700;font-size:.85em;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
#toast.show{opacity:1}
</style>
</head>

const STRENGTH_ITEMS = [
  '3 × 15 calf raises',
  '3 × 10 split squats each leg',
  '3 × 15 glute bridges',
  '3 × 30 sec side planks',
  '3 × 10 bird dogs each side',
];

// ── ROSTER ────────────────────────────────────────────────────────
var PLAYERS = [];
var state = {current:null};
function getRoster(){try{return JSON.parse(localStorage.getItem(ROSTER_KEY)||'[]');}catch(e){return[];}}
function saveRoster(r){localStorage.setItem(ROSTER_KEY,JSON.stringify(r));}
function refreshPlayers(){PLAYERS=getRoster();}
function loadState(){try{state=JSON.parse(localStorage.getItem(STORE_KEY))||{current:null};}catch(e){state={current:null};}}
function saveState(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state));}catch(e){}}

// ── DONE ITEMS ────────────────────────────────────────────────────
function getDoneKey(n){return STORE_KEY+'_done_'+n.replace(/\s+/g,'_');}
function getDone(n){try{return JSON.parse(localStorage.getItem(getDoneKey(n))||'[]');}catch(e){return[];}}
function saveDone(n,arr){localStorage.setItem(getDoneKey(n),JSON.stringify(arr));}

function toggleItem(itemId){
  var done=getDone(state.current);
  var idx=done.indexOf(itemId);
  if(idx>=0){done.splice(idx,1);}else{done.push(itemId);}
  saveDone(state.current,done);
  renderPlan();
  updateProgress();
  renderRegister();
}

// ── TOTALS ────────────────────────────────────────────────────────
function getAllItems(){
  var items=[];
  HTC_PLAN.forEach(function(ph){ph.weeks.forEach(function(wk){wk.items.forEach(function(it){items.push(it);});});});
  return items;
}
function countDone(n){var done=getDone(n);return getAllItems().filter(function(it){return done.indexOf(it.id)>=0;}).length;}

// ── PROGRESS ──────────────────────────────────────────────────────
function updateProgress(){
  var all=getAllItems().length;
  var done=countDone(state.current);
  var pct=all>0?Math.round(done/all*100):0;
  var el=document.getElementById('prog-fill');if(el)el.style.width=pct+'%';
  var lb=document.getElementById('prog-label');if(lb)lb.textContent=done+' / '+all+' sessions';
  var sub=document.getElementById('ah-sub');
  if(sub)sub.textContent=pct+'% complete — Aug 29, 2026';
}

// ── RENDER PLAN ───────────────────────────────────────────────────
function renderPlan(){
  var wrap=document.getElementById('plan-wrap');
  if(!wrap)return;
  var done=getDone(state.current);
  var html='';

  HTC_PLAN.forEach(function(phase){
    html+='<div class="phase-hdr">'+phase.phase+'</div>';
    phase.weeks.forEach(function(wk){
      var wkItems=wk.items;
      var wkDone=wkItems.filter(function(it){return done.indexOf(it.id)>=0;}).length;
      var wkPct=wkItems.length>0?wkDone/wkItems.length*100:0;
      html+='<div class="week-card'+(wk.special?' special':'')+'">'
        +'<div class="week-hdr"><div>'
        +'<div class="week-title">'+wk.label+'</div>'
        +'<div class="week-dates">'+wk.dates+'</div>'
        +'</div><span class="week-target">'+wk.target+'</span></div>'
        +'<div class="week-progress"><div class="week-prog-fill" style="width:'+wkPct.toFixed(0)+'%"></div></div>';

      wkItems.forEach(function(item){
        var isDone=done.indexOf(item.id)>=0;
        html+='<div class="train-item'+(isDone?' done':'')+(item.strength?' strength':'')+'" onclick="toggleItem(\''+item.id+'\')">'
          +'<div class="train-cb"><div class="train-cb-inner"></div></div>'
          +'<span class="train-day">'+item.day+'</span>'
          +'<span class="train-desc">'+item.desc+'</span>'
          +'</div>';
      });
      html+='</div>';
    });
  });

  // Strength card
  html+='<div class="phase-hdr">Strength Session Template</div>'
    +'<div class="strength-card"><div class="strength-title">💪 Perform 1–2x weekly</div>';
  STRENGTH_ITEMS.forEach(function(s){
    html+='<div class="strength-item"><span class="strength-bullet">›</span>'+s+'</div>';
  });
  html+='<div class="strength-note">15–20 minutes · log via the Strength checkbox in each week</div></div>';

  wrap.innerHTML=html;
}

// ── REGISTER ──────────────────────────────────────────────────────
function registerPlayer(){
  var inp=document.getElementById('reg-name');
  var raw=(inp?inp.value.trim():'');
  if(!raw){showToast('Enter your name first!');return;}
  var name=raw.charAt(0).toUpperCase()+raw.slice(1);
  var roster=getRoster();
  var existing=roster.find(function(p){return p.name.toLowerCase()===name.toLowerCase();});
  if(existing){showToast('Welcome back, '+name+'!');selectPlayer(existing.name);return;}
  roster.push({name:name});saveRoster(roster);refreshPlayers();
  if(inp)inp.value='';
  showToast('Welcome to the program, '+name+'! 🎉');
  selectPlayer(name);
}

function renderRegister(){
  refreshPlayers();
  var grid=document.getElementById('player-grid');
  var regOr=document.getElementById('reg-or');
  if(regOr)regOr.style.display=PLAYERS.length?'block':'none';
  if(!PLAYERS.length){grid.innerHTML='';return;}
  grid.innerHTML=PLAYERS.map(function(p){
    var done=countDone(p.name);
    var total=getAllItems().length;
    var pct=total>0?Math.round(done/total*100):0;
    return '<div class="pc" data-name="'+p.name+'">'
      +'<div class="pc-av">'+p.name.charAt(0).toUpperCase()+'</div>'
      +'<div class="pc-name">'+p.name+'</div>'
      +'<div class="pc-done">'+done+'/'+total+' sessions</div>'
      +'</div>';
  }).join('');
}

// ── NAVIGATION ────────────────────────────────────────────────────
function selectPlayer(name){
  state.current=name;saveState();
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
  document.getElementById('app-screen').classList.add('active');
  document.getElementById('ah-av').textContent=name.charAt(0).toUpperCase();
  document.getElementById('ah-name').textContent=name;
  renderPlan();
  updateProgress();
}
function goSelect(){
  state.current=null;saveState();
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
  document.getElementById('register-screen').classList.add('active');
  renderRegister();
}

var toastTimer;
function showToast(msg){
  var el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.classList.remove('show');},2200);
}

// ── EVENT WIRING ──────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded',function(){
  document.getElementById('join-btn').addEventListener('click',registerPlayer);
  document.getElementById('reg-name').addEventListener('keydown',function(e){if(e.key==='Enter')registerPlayer();});
  document.getElementById('change-btn').addEventListener('click',goSelect);
  document.getElementById('player-grid').addEventListener('click',function(e){
    var pc=e.target.closest('.pc');if(!pc)return;
    selectPlayer(pc.dataset.name);
  });
});

// ── INIT ──────────────────────────────────────────────────────────
loadState();refreshPlayers();renderRegister();
if(state.current&&PLAYERS.find(function(p){return p.name===state.current;})){
  selectPlayer(state.current);
}
</script>
